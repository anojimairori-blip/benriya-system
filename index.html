<title>野島井戸システム</title>

<style>
:root{
  --bg:#F5F3EE;--surface:#FFF;--surface2:#EFECE6;--border:#DDD9D0;
  --accent:#1A3A6B;--accent-light:#E4EAF6;
  --text:#1A1A1A;--text2:#5A5550;--text3:#9A9590;
  --red:#C0392B;--red-light:#FDEDEB;
  --blue:#1A5276;--blue-light:#EAF2FF;
  --gold:#B8860B;--gold-light:#FDF8E1;
  --green:#27AE60;--green-light:#E8F6EE;
  --orange:#D35400;--orange-light:#FDEBD0;
  --radius:10px;
  --main-header-h:56px;
}
@media(max-width:768px){
  :root{ --main-header-h:52px; }
}
[data-theme="dark"]{
  --bg:#0F1117;--surface:#1C1E26;--surface2:#252830;--border:#353842;
  --accent:#5B8FCF;--accent-light:#1A2A3F;
  --text:#E8E9EF;--text2:#9EA3B0;--text3:#5A6070;
  --red:#E55C5C;--red-light:#2D1B1B;
  --blue:#5B9BD5;--blue-light:#1A2535;
  --gold:#D4A435;--gold-light:#2D2310;
  --green:#4A9E6B;--green-light:#1A3528;
  --orange:#E07A3A;--orange-light:#2D1A0A;
}
[data-theme="navy"]{
  --bg:#EEF1F8;--surface:#FFF;--surface2:#E4E9F4;--border:#C8D0E0;
  --accent:#0D2C5E;--accent-light:#DEE6F4;
  --text:#0D1B3E;--text2:#4A5570;--text3:#8A92A8;
}
[data-theme="natural"]{
  --bg:#F5F3EE;--surface:#FFF;--surface2:#EFECE6;--border:#DDD9D0;
  --accent:#2D5A3D;--accent-light:#E6F2EA;
  --text:#1A1A1A;--text2:#5A5550;--text3:#9A9590;
}
[data-theme="sunset"]{
  --bg:#FFF6EB;--surface:#FFF;--surface2:#FCE8D0;--border:#E8C9A8;
  --accent:#C0392B;--accent-light:#FDECE8;
  --text:#3E1F0D;--text2:#7A4A2E;--text3:#B58A60;
}
[data-theme="mint"]{
  --bg:#F0F8F4;--surface:#FFF;--surface2:#DEF0E6;--border:#B8D8C4;
  --accent:#0E7C5C;--accent-light:#D9F0E5;
  --text:#0D2B20;--text2:#4A6F60;--text3:#8AA89A;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans JP','Hiragino Sans','Meiryo',sans-serif;
  background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}

/* ===== ログイン画面 ===== */
.login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.login-card{
  background:var(--surface);border-radius:16px;
  padding:40px 28px;max-width:380px;width:100%;
  box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;
}
.login-logo{
  width:72px;height:72px;border-radius:18px;background:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:700;color:white;margin-bottom:18px;
}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px;color:var(--text)}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.login-btn{
  width:100%;padding:13px 18px;border-radius:10px;
  background:var(--accent);color:white;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:opacity .15s;
}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{
  margin-top:14px;padding:10px;border-radius:8px;
  background:var(--red-light);color:var(--red);font-size:12px;
  display:none;
}
.login-error.show{display:block}
.login-foot{
  margin-top:24px;font-size:11px;color:var(--text3);line-height:1.7;
}

/* ===== ヘッダー ===== */
.app-header{
  position:sticky;top:0;height:var(--main-header-h);flex-shrink:0;
  background:var(--accent);color:white;
  display:flex;align-items:center;padding:0 14px;gap:12px;
  z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.06);
}
.hamburger{
  width:40px;height:40px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:22px;
}
.hamburger:hover{background:rgba(255,255,255,.1)}
.app-title{font-size:16px;font-weight:700;flex:1;letter-spacing:.02em}
.app-title-link{
  color:inherit;text-decoration:none;
  border-bottom:1px dashed transparent;
  transition:border-color .15s;
}
.app-title-link:hover{border-bottom-color:rgba(255,255,255,.6)}
@media(max-width:768px){
  .app-title{font-size:14px}
}
.app-title-sub{font-size:11px;opacity:.85;font-weight:400;margin-left:8px}
.app-version-badge{
  display:inline-block;
  font-size:10px;
  font-weight:600;
  margin-left:8px;
  padding:2px 7px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.3);
  border-radius:10px;
  letter-spacing:.3px;
  vertical-align:middle;
}
@media(max-width:480px){.app-title-sub{display:none}.app-version-badge{font-size:9px;padding:1px 5px;margin-left:5px}}
.header-action{
  width:38px;height:38px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:18px;
}
.header-action:hover{background:rgba(255,255,255,.1)}
.user-chip{
  font-size:11px;padding:5px 10px;border-radius:99px;
  background:rgba(255,255,255,.15);color:white;font-weight:500;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
@media(max-width:600px){.user-chip{display:none}}

/* ===== ドロワー ===== */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;
}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;height:100%;width:280px;max-width:80%;
  background:var(--surface);z-index:31;
  transform:translateX(-100%);transition:transform .2s;
  display:flex;flex-direction:column;
  box-shadow:2px 0 12px rgba(0,0,0,.1);
}
.drawer.open{transform:translateX(0) !important}
/* v1.3.1: ピン留め（PCで常時表示） */
body.drawer-pinned .drawer{
  transform:translateX(0);
  box-shadow:1px 0 4px rgba(0,0,0,.05);
}
body.drawer-pinned .drawer-overlay{display:none !important}
body.drawer-pinned .main,
body.drawer-pinned .app-header{
  margin-left:280px;
}
body.drawer-pinned .hamburger{display:none}
/* v1.3.2: 共有モードではピン留めを強制無効化（ズレ防止） */
body.share-mode.drawer-pinned .main,
body.share-mode.drawer-pinned .app-header{margin-left:0 !important}
body.share-mode .drawer{transform:translateX(-100%) !important}
body.share-mode .drawer-pin-btn{display:none !important}
/* v1.3.5: モバイルではピン留めを完全に無効化（ハンバーガーが効かなくなるバグ修正） */
@media(max-width:900px){
  body.drawer-pinned .main,
  body.drawer-pinned .app-header{margin-left:0 !important}
  body.drawer-pinned .drawer:not(.open){transform:translateX(-100%) !important}
  body.drawer-pinned .drawer.open{transform:translateX(0) !important}
  body.drawer-pinned .hamburger{display:inline-flex !important}
  body.drawer-pinned .drawer-overlay{display:block !important}
  body.drawer-pinned .drawer-overlay.open{opacity:1 !important;pointer-events:auto !important}
  /* モバイルでは画鋲ボタン自体を隠す */
  .drawer-pin-btn{display:none !important}
}
.drawer-pin-btn{
  position:absolute;top:14px;right:14px;
  background:transparent;border:none;cursor:pointer;
  font-size:18px;color:var(--text2);padding:4px 8px;
  border-radius:4px;
}
.drawer-pin-btn:hover{background:var(--surface2);color:var(--accent)}
.drawer-pin-btn.active{color:var(--accent);background:var(--surface2)}
.drawer-head{
  padding:18px 18px 12px;border-bottom:1px solid var(--border);
}
.drawer-user{font-size:12px;color:var(--text2)}
.drawer-user-name{font-size:14px;font-weight:600;color:var(--text);margin-top:2px}
.drawer-nav{flex:1;overflow-y:auto;padding:8px 0}
.drawer-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;font-size:14px;color:var(--text);
  border-left:3px solid transparent;cursor:pointer;
  width:100%;text-align:left;
}
.drawer-item:hover{background:var(--surface2)}
.drawer-item.active{
  background:var(--accent-light);border-left-color:var(--accent);
  color:var(--accent);font-weight:600;
}
.drawer-icon{font-size:18px;width:22px;text-align:center}
.drawer-foot{padding:14px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.drawer-foot-row{display:flex;justify-content:space-between;margin-top:4px}

/* ===== レイアウト ===== */
.app-shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{
  flex:1;overflow-y:auto;overflow-x:hidden;
  display:block;background:var(--bg);
  -webkit-overflow-scrolling:touch;
}
.page{display:none;padding:16px;max-width:960px;margin:0 auto}
.page.active{display:block}
@media(max-width:768px){.page{padding:12px}}

/* ===== 共通カード ===== */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
}
.card+.card{margin-top:12px}
.section-title{
  font-size:13px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.05em;
  margin:18px 4px 8px;
}
.section-title:first-child{margin-top:0}

/* ===== ボタン ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:8px;
  font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  min-height:40px;transition:opacity .15s,background .15s;
}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);opacity:.9}
.btn-danger{background:var(--red);color:white;border-color:var(--red)}
.btn-danger:hover{opacity:.9}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--surface2)}
.btn-sm{padding:6px 12px;font-size:12px;min-height:32px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== フォーム ===== */
.field{margin-bottom:14px}
.field-label{
  display:block;font-size:12px;font-weight:600;
  color:var(--text2);margin-bottom:6px;
}
.field-label-req::after{content:" *";color:var(--red)}
.field-hint{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.5}
.input,.select,.textarea{
  width:100%;padding:10px 12px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text);
  font-size:14px;min-height:42px;
  transition:border-color .15s;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--accent);
}
.textarea{min-height:80px;resize:vertical}
.input[readonly]{background:var(--surface2);color:var(--text2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.field-row{grid-template-columns:1fr}}

/* ===== 現場一覧 ===== */
.well-list-head{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.well-list-head .input{flex:1;min-width:180px}
.well-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;
}
.well-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;cursor:pointer;
  transition:border-color .15s,transform .1s;
}
.well-card:hover{border-color:var(--accent)}
.well-card:active{transform:scale(.99)}
.well-card-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.well-card-cust{font-size:12px;color:var(--text2);margin-bottom:8px}
.well-card-meta{
  display:flex;justify-content:space-between;align-items:flex-end;
  font-size:11px;color:var(--text3);margin-top:10px;
}
.well-card-depth{font-size:18px;font-weight:700;color:var(--accent)}
.well-status{
  display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:10px;font-weight:700;
}
.well-status.draft{background:var(--surface2);color:var(--text2)}
.well-status.drilling{background:var(--blue-light);color:var(--blue)}
.well-status.completed{background:var(--green-light);color:var(--green)}
.well-status.archived{background:var(--surface2);color:var(--text3)}

/* ===== 現場詳細 ===== */
.detail-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;flex-wrap:wrap;margin-bottom:14px;
}
.detail-name{font-size:18px;font-weight:700;color:var(--text)}
.detail-meta{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.7}
.detail-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ===== 地層プレビュー ===== */
.preview-wrap{
  display:flex;gap:12px;align-items:flex-start;
}
.preview-bar{
  display:flex;flex-direction:column;width:88px;flex-shrink:0;
  border-radius:8px;overflow:hidden;
  border:1px solid var(--border);
}
.preview-row{
  height:34px;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;font-size:11px;
  border-bottom:1px solid rgba(0,0,0,.05);
}
.preview-row:last-child{border-bottom:none}
.preview-list{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.log-row{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;cursor:pointer;
  display:flex;align-items:center;gap:8px;min-height:42px;
  transition:border-color .15s;
}
.log-row:hover{border-color:var(--accent)}
.log-row-depth{
  font-size:14px;font-weight:700;color:var(--accent);
  min-width:64px;font-feature-settings:"tnum";
}
.log-row-info{flex:1;min-width:0;font-size:12px;color:var(--text2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-row-thumbs{display:flex;gap:3px;flex-shrink:0}
.log-row-thumb{
  width:22px;height:22px;border-radius:3px;background:var(--surface2);
  object-fit:cover;border:1px solid var(--border);
}
.log-row-time{
  font-size:10px;color:var(--text3);font-feature-settings:"tnum";
  flex-shrink:0;
}

/* ===== ロッドカード（v1.1.0）===== */
.rod-list{display:flex;flex-direction:column;gap:10px}
.rod-card{
  display:flex;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;cursor:pointer;
  min-height:72px;transition:border-color .15s, transform .1s;
}
.rod-card:hover{border-color:var(--accent)}
.rod-card:active{transform:scale(.997)}
.rod-card-bar{
  width:32px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--surface2);
}
.rod-geo-cell{
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:600;
  text-align:center;line-height:1.2;
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:1px 2px;overflow:hidden;
}
.rod-geo-cell:last-child{border-bottom:none}
/* v1.3.1: 縦帯のラベルを白バッジで読みやすく */
.rod-geo-label{
  display:inline-block;
  writing-mode:vertical-rl;
  font-size:11px;font-weight:700;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;
  background:rgba(255,255,255,.85);
  color:#222 !important;
  padding:6px 3px;border-radius:5px;
  border:1px solid rgba(0,0,0,.12);
  box-shadow:0 1px 2px rgba(0,0,0,.1);
  text-shadow:none;
}
.rod-geo-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 5px,var(--bg) 5px,var(--bg) 10px);
  color:var(--text3);font-size:9px;writing-mode:vertical-rl;
}
.rod-card-body{flex:1;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.rod-card-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.rod-card-num{font-size:14px;font-weight:700;color:var(--text)}
.rod-card-depth{
  font-size:18px;font-weight:700;color:var(--accent);
  font-feature-settings:"tnum";line-height:1.1;
}
.rod-card-depth small{font-size:11px;font-weight:500;margin-left:2px}
.rod-card-range{font-size:11px;color:var(--text3)}
.rod-card-geos{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.rod-card-geos-empty{color:var(--text3);font-size:11px;font-style:italic}

/* ロッド情報カード（モーダル内） */
.rod-info-card{
  background:var(--surface2);border-radius:10px;padding:12px;
}
.rod-info-row{
  display:flex;justify-content:space-between;font-size:13px;
  padding:3px 0;
}
.rod-info-row span{color:var(--text2)}

/* 地質エントリカード（モーダル内） */
.geo-entry-list{display:flex;flex-direction:column;gap:8px}
.geo-entry-card{
  display:flex;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
}
.geo-entry-bar{width:6px;flex-shrink:0}
.geo-entry-body{flex:1;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.geo-entry-head{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;
}
.geo-entry-range{font-size:11px;color:var(--text3);font-feature-settings:"tnum"}
.geo-entry-note{
  font-size:12px;color:var(--text2);
  background:var(--surface2);padding:6px 8px;border-radius:6px;
  white-space:pre-wrap;word-break:break-word;
}
.geo-entry-photos{display:flex;gap:4px;flex-wrap:wrap}
.geo-entry-actions{display:flex;gap:6px;justify-content:flex-end}

/* ===== ログ編集モーダル ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:50;display:none;align-items:flex-end;justify-content:center;
  padding:0;
}
.modal-overlay.open{display:flex}
@media(min-width:769px){
  .modal-overlay{align-items:center;padding:20px}
}
.modal{
  background:var(--surface);border-radius:14px 14px 0 0;
  width:100%;max-width:560px;max-height:92vh;max-height:92dvh;
  display:flex;flex-direction:column;
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
}
@media(min-width:769px){
  .modal{border-radius:14px;max-height:88vh}
}
.modal-head{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.modal-title{font-size:15px;font-weight:700;color:var(--text)}
.modal-close{
  width:32px;height:32px;border-radius:6px;font-size:20px;color:var(--text2);
  display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--surface2)}
.modal-body{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.modal-foot{
  padding:12px 16px;border-top:1px solid var(--border);
  display:flex;gap:8px;flex-shrink:0;
}
.modal-foot .btn{flex:1}

/* ===== ステッパー（パイプ本数） ===== */
.stepper{
  display:flex;align-items:stretch;gap:0;
  border:1px solid var(--border);border-radius:10px;overflow:hidden;
  background:var(--surface);
}
.stepper-btn{
  width:54px;font-size:22px;font-weight:700;
  background:var(--surface2);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  user-select:none;
}
.stepper-btn:hover{background:var(--accent-light)}
.stepper-btn:disabled{opacity:.4;cursor:not-allowed}
.stepper-val{
  flex:1;text-align:center;font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-feature-settings:"tnum";
  border-left:1px solid var(--border);border-right:1px solid var(--border);
}
.stepper-val small{font-size:11px;font-weight:500;color:var(--text2);margin-left:3px}

/* ===== チップグループ（進入率・地質） ===== */
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:8px 12px;border-radius:99px;
  border:1px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:500;color:var(--text2);
  min-height:36px;display:inline-flex;align-items:center;
  user-select:none;
}
.chip:hover{border-color:var(--accent)}
.chip.active{
  background:var(--accent);color:white;border-color:var(--accent);font-weight:700;
}
.chip-sm{padding:5px 9px;font-size:11px;min-height:28px}

/* ===== 自動計算深度 ===== */
.depth-display{
  background:var(--accent-light);border:1px solid var(--accent);
  border-radius:10px;padding:14px;text-align:center;margin:8px 0 4px;
}
.depth-display-label{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px}
.depth-display-val{
  font-size:32px;font-weight:700;color:var(--accent);
  font-feature-settings:"tnum";line-height:1.1;
}
.depth-display-val small{font-size:14px;font-weight:500;margin-left:3px}
.depth-display-formula{font-size:10px;color:var(--text2);margin-top:4px}

/* ===== 写真エリア ===== */
.photo-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;
}
.photo-cell{
  position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;
  background:var(--surface2);border:1px solid var(--border);
}
.photo-cell img{width:100%;height:100%;object-fit:cover;display:block}
.photo-cell-del{
  position:absolute;top:2px;right:2px;
  width:22px;height:22px;border-radius:99px;
  background:rgba(0,0,0,.6);color:white;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.photo-add{
  aspect-ratio:1;border-radius:6px;
  border:2px dashed var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--text2);cursor:pointer;
}
.photo-add:hover{border-color:var(--accent);color:var(--accent)}
.photo-counter{font-size:11px;color:var(--text3);margin-top:4px}

/* ===== トースト・確認 ===== */
.success-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--green);color:white;
  padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;
  z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);
  animation:toastIn .25s ease-out;max-width:90%;text-align:center;
}
@keyframes toastIn{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ===== 共有モーダル ===== */
.share-url-box{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:10px;font-family:monospace;font-size:11px;
  word-break:break-all;color:var(--text);margin-bottom:12px;
}
.share-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-btn{
  padding:10px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.share-btn:hover{background:var(--surface2);border-color:var(--accent)}
.share-btn.line{background:#06C755;color:white;border-color:#06C755}
.share-btn.line:hover{opacity:.9}

/* ===== 地質凡例 ===== */
.geology-legend{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--border);font-size:11px;color:var(--text2);
}
.geology-legend-item{display:flex;align-items:center;gap:4px}
.geology-legend-swatch{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.1)}

/* ===== ローダー ===== */
.loader{
  display:inline-block;width:18px;height:18px;
  border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-page{
  display:flex;align-items:center;justify-content:center;
  padding:40px;color:var(--text2);gap:10px;font-size:13px;
}

/* ===== 空表示 ===== */
.empty{
  text-align:center;padding:40px 20px;color:var(--text3);
}
.empty-icon{font-size:36px;margin-bottom:8px;opacity:.6}
.empty-text{font-size:13px;margin-bottom:14px}

/* ===== 共有閲覧モード ===== */
body.share-mode .app-header{background:var(--accent)}
body.share-mode .share-banner{
  background:var(--gold-light);color:var(--gold);
  padding:8px 14px;font-size:12px;text-align:center;font-weight:600;
}
.detail-actions-edit{display:flex;gap:6px;flex-wrap:wrap}
body.share-mode .detail-actions-edit{display:none !important}
body.share-mode .log-row{cursor:default}

/* GPS情報表示 */
.gps-row{
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  font-size:11px;color:var(--text2);
}
.gps-row .gps-coords{font-family:monospace;background:var(--surface2);padding:2px 6px;border-radius:4px}

/* 設定タブ */
.settings-tabs{
  display:flex;gap:4px;background:var(--surface2);
  border-radius:10px;padding:4px;margin-bottom:14px;
}
.settings-tab{
  flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;
  color:var(--text2);min-height:38px;display:flex;align-items:center;justify-content:center;
}
.settings-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* マスタリスト */
.master-list{display:flex;flex-direction:column;gap:6px}
.master-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;background:var(--surface2);border-radius:8px;
}
.master-item-name{flex:1;font-size:13px}
.master-add-row{display:flex;gap:6px;margin-top:8px}
.master-add-row .input{flex:1}

/* テーマ選択 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.theme-card{
  border:1px solid var(--border);border-radius:10px;padding:10px;
  cursor:pointer;text-align:center;
}
.theme-card.active{border-color:var(--accent);border-width:2px;padding:9px}
.theme-card-swatch{
  height:36px;border-radius:6px;margin-bottom:6px;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.theme-card-name{font-size:11px;font-weight:600}

/* 共有ビュー専用 */
.share-only{display:none}
body.share-mode .share-only{display:block}
body.share-mode .non-share-only{display:none}

/* ===== 地質パターン（v1.2.4 教科書風メリハリ版） ===== */
/* 細粒（少なめ）— 砂が薄い */
.geo-pattern-fine-light {
  background-image:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.7) 0.9px, transparent 1.4px);
  background-size: 9px 9px;
}
/* 細粒（多め）— 砂が密集（教科書の砂層風） */
.geo-pattern-fine-dense {
  background-image:
    radial-gradient(circle at 25% 25%, rgba(0,0,0,.75) 1.0px, transparent 1.6px),
    radial-gradient(circle at 75% 75%, rgba(0,0,0,.75) 1.0px, transparent 1.6px),
    radial-gradient(circle at 75% 25%, rgba(0,0,0,.6) 0.8px, transparent 1.3px),
    radial-gradient(circle at 25% 75%, rgba(0,0,0,.6) 0.8px, transparent 1.3px);
  background-size: 5px 5px, 5px 5px, 5px 5px, 5px 5px;
  background-position: 0 0, 2.5px 2.5px, 1.25px 1.25px, 3.75px 3.75px;
}
/* 粗粒（少なめ）— 砂利が薄い */
.geo-pattern-coarse-light {
  background-image:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.75) 2.0px, transparent 2.8px);
  background-size: 18px 18px;
}
/* 粗粒（多め）— 砂利が密集（教科書のれきと砂の層風） */
.geo-pattern-coarse-dense {
  background-image:
    radial-gradient(circle at 30% 30%, rgba(0,0,0,.75) 2.0px, transparent 2.8px),
    radial-gradient(circle at 75% 65%, rgba(0,0,0,.7) 2.4px, transparent 3.4px),
    radial-gradient(circle at 60% 20%, rgba(0,0,0,.55) 1.3px, transparent 2.0px),
    radial-gradient(circle at 20% 80%, rgba(0,0,0,.6) 1.6px, transparent 2.4px);
  background-size: 10px 10px, 12px 12px, 8px 8px, 9px 9px;
  background-position: 0 0, 5px 3px, 2px 7px, 7px 8px;
}
/* 斜線（粘土用） */
.geo-pattern-diagonal {
  background-image: repeating-linear-gradient(
    45deg,
    transparent 0,
    transparent 3px,
    rgba(0,0,0,.4) 3px,
    rgba(0,0,0,.4) 4.5px
  );
}
/* 火山灰（横線・教科書風） — v1.2.4 NEW */
.geo-pattern-ash {
  background-image: repeating-linear-gradient(
    0deg,
    transparent 0,
    transparent 4px,
    rgba(0,0,0,.55) 4px,
    rgba(0,0,0,.55) 4.6px
  );
}
/* 表土（クロス・草根表現） — v1.2.4 NEW */
.geo-pattern-topsoil {
  background-image:
    linear-gradient(45deg, transparent 40%, rgba(0,0,0,.6) 40%, rgba(0,0,0,.6) 50%, transparent 50%, transparent 90%, rgba(0,0,0,.6) 90%);
  background-size: 8px 8px;
}
/* 無地 */
.geo-pattern-none {
  /* 無地（背景色のみ） */
}
/* 後方互換：旧キー名 fine / coarse もサポート */
.geo-pattern-fine {
  background-image:
    radial-gradient(circle at 25% 25%, rgba(0,0,0,.75) 1.0px, transparent 1.6px),
    radial-gradient(circle at 75% 75%, rgba(0,0,0,.75) 1.0px, transparent 1.6px);
  background-size: 6px 6px, 6px 6px;
  background-position: 0 0, 3px 3px;
}
.geo-pattern-coarse {
  background-image:
    radial-gradient(circle at 30% 30%, rgba(0,0,0,.75) 2.0px, transparent 2.8px),
    radial-gradient(circle at 75% 65%, rgba(0,0,0,.7) 2.4px, transparent 3.4px);
  background-size: 14px 14px, 16px 16px;
  background-position: 0 0, 7px 4px;
}

/* パターン選択UI */
.pattern-select{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pattern-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border:1px solid var(--border);
  border-radius:6px;background:var(--surface);font-size:11px;
  cursor:pointer;transition:border-color .12s;
}
.pattern-chip.active{border-color:var(--accent);border-width:2px;padding:3px 7px;background:var(--surface2)}
.pattern-chip-preview{
  display:inline-block;width:20px;height:14px;border:1px solid var(--border);border-radius:2px;
  background-color:#D2C49C;
}

/* ===== 地質情報セクション（v1.3.0） ===== */

/* タブUI（v1.3.1, v1.3.3で視認性強化） */
.tabs-bar{
  display:flex;gap:0;margin:-12px -12px 12px;
  border-bottom:2px solid var(--border);
  background:var(--surface2);
  border-radius:8px 8px 0 0;
  overflow:hidden;
}
.tab-btn{
  flex:1;padding:13px 8px;
  background:transparent;border:none;
  font-size:13px;font-weight:600;color:var(--text2);
  cursor:pointer;border-bottom:4px solid transparent;
  transition:background .15s,color .15s,border-color .15s;
  position:relative;
  opacity:.7;
}
.tab-btn.active{
  color:#fff;
  background:var(--accent);
  border-bottom-color:var(--accent);
  font-weight:700;
  font-size:14px;
  opacity:1;
  box-shadow:inset 0 -3px 0 0 rgba(255,255,255,.2);
}
.tab-btn:not(.active):hover{background:rgba(0,0,0,.04);opacity:1}
.tab-pane{padding:4px 0}

/* v1.3.3: 内部タブ（地質情報内のサブタブ）*/
.subtabs-bar{
  display:flex;gap:4px;
  padding:8px 4px 4px;
  border-bottom:1px solid var(--border);
  margin-bottom:8px;
  flex-wrap:wrap;
}
.subtab-btn{
  padding:7px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:18px;
  font-size:12px;font-weight:600;color:var(--text2);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.subtab-btn.active{
  background:var(--accent);
  color:#fff;border-color:var(--accent);
  font-weight:700;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.subtab-btn:not(.active):hover{
  background:var(--surface);border-color:var(--accent);
}
.subtab-pane{
  max-height:560px;overflow-y:auto;
  padding:4px 2px;
  scrollbar-width:thin;
}
.subtab-pane::-webkit-scrollbar{width:8px}
.subtab-pane::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.subtab-pane::-webkit-scrollbar-thumb:hover{background:var(--text3)}

.geo-info-card{
  margin-top:14px;
}
.geo-info-head{
  user-select:none;
}
.geo-info-fetched{
  font-size:11px;color:var(--text2);
}
.geo-info-summary{
  padding:10px 4px;
  display:flex;gap:14px;flex-wrap:wrap;
  font-size:13px;color:var(--text2);
}
.geo-info-summary-empty{
  font-style:italic;color:var(--text3);
}
.geo-info-loading{
  padding:20px;text-align:center;color:var(--text2);
}
.geo-info-body{
  display:flex;flex-direction:column;gap:12px;margin-top:8px;
}
.geo-info-block{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
}
.geo-info-block-title{
  font-weight:700;font-size:13px;color:var(--text);
  margin-bottom:6px;
}
.geo-info-row{
  display:flex;gap:8px;align-items:baseline;
  font-size:13px;color:var(--text);margin:2px 0;
}
.geo-info-label{
  display:inline-block;width:70px;color:var(--text2);font-size:11px;
}
.geo-info-source{
  font-size:10px;color:var(--text3);margin-top:6px;font-style:italic;
}
.geo-info-failed{
  background:rgba(255,200,200,.1);
  border-color:var(--orange);
}
.geo-info-failed-msg{
  color:var(--orange);font-size:12px;margin:4px 0 8px;
}
.geo-info-map{
  width:100%;height:200px;
  border:1px solid var(--border);border-radius:6px;overflow:hidden;
  margin-top:6px;
}
/* v1.3.4: 水源予測ブロック */
.water-prediction-row{
  display:flex;gap:10px;align-items:flex-start;
  padding:6px 0;border-bottom:1px dashed rgba(0,0,0,.08);
}
.water-prediction-row:last-child{border-bottom:none}
.water-prediction-label{
  flex-shrink:0;width:90px;
  font-size:11px;font-weight:700;color:var(--text);
}
.water-prediction-value{
  flex:1;font-size:13px;color:var(--text);line-height:1.4;
}
.water-prediction-elevnote{
  margin-top:8px;padding:6px 8px;
  background:rgba(255,255,255,.5);
  border-radius:4px;font-size:11px;color:var(--text);
  line-height:1.5;
}
.water-prediction-note{
  margin-top:6px;padding:6px 8px;
  background:rgba(255, 200, 100, .15);
  border-left:3px solid #c89c1e;
  border-radius:3px;
  font-size:11px;color:var(--text);
  line-height:1.5;
}
/* v1.3.1: 外部参考リンクボタン */
.external-link-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  text-decoration:none;color:var(--text);
  transition:border-color .12s,background .12s,transform .08s;
}
.external-link-btn:hover{
  border-color:var(--accent);
  background:var(--surface2);
  transform:translateY(-1px);
}
.external-link-icon{
  font-size:22px;flex-shrink:0;width:30px;text-align:center;
}
.external-link-body{
  flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;
}
.external-link-body strong{font-size:13px;color:var(--text);font-weight:700}
.external-link-body small{font-size:11px;color:var(--text2);line-height:1.3}
.external-link-arrow{
  font-size:20px;color:var(--text3);flex-shrink:0;
}
/* 全画面マップ */
.geo-map-fullscreen{
  display:none;
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:#000;z-index:9999;
  flex-direction:column;
}
.geo-map-fullscreen-head{
  background:var(--accent);color:#fff;
  padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  font-weight:600;
}
.geo-map-fullscreen-head button{
  background:rgba(255,255,255,.2);border:none;color:#fff;
  width:32px;height:32px;border-radius:6px;font-size:18px;cursor:pointer;
}
.geo-map-fullscreen-body{
  flex:1;width:100%;
}

/* ソート切替トグル（v1.2.2） */
.sort-toggle{
  display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;
}
.sort-btn{
  padding:5px 10px;background:var(--surface);border:none;
  font-size:11px;color:var(--text2);cursor:pointer;
  border-right:1px solid var(--border);
}
.sort-btn:last-child{border-right:none}
.sort-btn.active{background:var(--accent);color:#fff;font-weight:600}
.sort-btn:not(.active):hover{background:var(--surface2)}

/* パターンピッカー（v1.2.5） */
.pattern-pick-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text);font-size:11px;cursor:pointer;
  transition:border-color .12s;
}
.pattern-pick-btn:hover{border-color:var(--accent);background:var(--surface2)}
.pattern-pick-preview{
  display:inline-block;width:32px;height:18px;
  border:1px solid rgba(0,0,0,.2);border-radius:3px;flex-shrink:0;
}
.pattern-pick-label{white-space:nowrap}

/* パターンピッカーモーダル内のグリッド */
.pattern-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:10px;
}
.pattern-grid-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 8px;border:2px solid var(--border);border-radius:8px;
  background:var(--surface);cursor:pointer;
  transition:border-color .12s,transform .08s;
}
.pattern-grid-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.pattern-grid-item.active{border-color:var(--accent);background:var(--surface2)}
.pattern-grid-preview{
  width:100%;aspect-ratio:2/1;
  border:1px solid rgba(0,0,0,.2);border-radius:4px;
  background-color:#D2C49C;
}
.pattern-grid-label{
  font-size:11px;font-weight:600;color:var(--text);text-align:center;line-height:1.2;
}
  display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;
}
.sort-btn{
  padding:5px 10px;background:var(--surface);border:none;
  font-size:11px;color:var(--text2);cursor:pointer;
  border-right:1px solid var(--border);
}
.sort-btn:last-child{border-right:none}
.sort-btn.active{background:var(--accent);color:#fff;font-weight:600}
.sort-btn:not(.active):hover{background:var(--surface2)}

// 深度計算（旧: pipeCount + pipePartial → 新: ロッド本数のみ）
function calcDepth(headRodM, pipeM, pipeCount, pipePartial){
  const H = Number(headRodM)||DEFAULT_HEAD_ROD_M;
  const L = Number(pipeM)||DEFAULT_PIPE_M;
  const N = Math.max(0, parseInt(pipeCount,10)||0);
  const P = Math.max(0, Math.min(1, Number(pipePartial)||0));
  if(N === 0) return P * H;
  return H + (N - 1) * L + P * L;
}

// ロッド番号(1始まり)から累計深度を計算
// rodNum=1 → ヘッドロッド（深度=H）
// rodNum=2 → H + L
// rodNum=N → H + (N-1) × L
function rodDepth(headRodM, pipeM, rodNum){
  const H = Number(headRodM)||DEFAULT_HEAD_ROD_M;
  const L = Number(pipeM)||DEFAULT_PIPE_M;
  const n = Math.max(1, parseInt(rodNum,10)||1);
  return H + (n - 1) * L;
}

// ロッド番号からそのロッドの「区間」[from, to]を返す
// rodNum=1 → [0, H]
// rodNum=2 → [H, H+L]
// rodNum=N → [H+(N-2)L, H+(N-1)L]
function rodRange(headRodM, pipeM, rodNum){
  const H = Number(headRodM)||DEFAULT_HEAD_ROD_M;
  const L = Number(pipeM)||DEFAULT_PIPE_M;
  const n = Math.max(1, parseInt(rodNum,10)||1);
  if(n === 1) return [0, H];
  return [H + (n - 2) * L, H + (n - 1) * L];
}

// 地質情報取得
function getGeologyByKey(key){
  const all = [...DEFAULT_GEOLOGIES, ...(userPrefs.customGeologies||[])];
  const meta = all.find(g => g.key === key) || { key:'other', label:'その他', color:'#B5D4F4', pattern:'none' };
  // ユーザが標準地質のパターンを上書きしている場合、それを反映
  const overrides = userPrefs.geologyPatterns || {};
  if(overrides[key]) {
    return Object.assign({}, meta, { pattern: overrides[key] });
  }
  return meta;
}
function getAllGeologies(){
  const all = [...DEFAULT_GEOLOGIES, ...(userPrefs.customGeologies||[])];
  const order = userPrefs.geologyOrder || [];
  if(!order.length) return all;
  // 順序リストにあるキー優先、なければ末尾
  const result = [];
  const seen = new Set();
  order.forEach(key => {
    const m = all.find(x => x.key === key);
    if(m){ result.push(m); seen.add(key); }
  });
  all.forEach(m => { if(!seen.has(m.key)) result.push(m); });
  return result;
}

// 色の明暗判定（背景色に対する文字色決定用）
function isDarkColor(hex){
  if(!hex || hex.length < 7) return false;
  const r = parseInt(hex.substr(1,2),16);
  const g = parseInt(hex.substr(3,2),16);
  const b = parseInt(hex.substr(5,2),16);
  return ((r*299 + g*587 + b*114)/1000) < 125;
}

// undefined を再帰的に削除（Firestore保存用）
function sanitize(o){
  if(o == null || typeof o !== 'object') return o;
  if(Array.isArray(o)) return o.filter(v => v !== undefined).map(sanitize);
  const out = {};
  Object.keys(o).forEach(k => {
    const v = o[k];
    if(v === undefined) return;
    if(typeof v === 'number' && isNaN(v)) return;
    if(v instanceof Date){ out[k] = v.toISOString(); return; }
    out[k] = sanitize(v);
  });
  return out;
}

// 画像圧縮（Canvas、長辺1280px、JPEG q0.78）
function compressImage(file, maxLong = 1280, quality = 0.78){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = (e) => reject(e);
    img.onload = () => {
      let { width, height } = img;
      if(width >= height && width > maxLong){
        height = Math.round(height * (maxLong / width));
        width = maxLong;
      } else if(height > maxLong){
        width = Math.round(width * (maxLong / height));
        height = maxLong;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0,0,width,height);
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        if(!blob) { reject(new Error('圧縮失敗')); return; }
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('画像の読み込みに失敗'));
    reader.readAsDataURL(file);
  });
}

// GPS取得
function getGPS(timeoutMs = 10000){
  return new Promise((resolve, reject) => {
    if(!('geolocation' in navigator)){
      reject(new Error('この端末ではGPSを取得できません'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        at: isoNow()
      }),
      err => reject(new Error('GPS取得失敗: ' + (err.message || 'unknown'))),
      { enableHighAccuracy:true, timeout:timeoutMs, maximumAge:60000 }
    );
  });
}

// ============================================================
window.addEventListener('FB_READY', async () => {
  const FB = window.FB;
  const { auth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } = FB;

  // ロッド並び順をlocalStorageから復元（v1.2.2）
  try{
    const saved = localStorage.getItem('wellSysRodSortOrder');
    if(saved === 'asc' || saved === 'desc') window.rodSortOrder = saved;
  } catch(e){}

  // 共有モードの判定（URLの ?share=token または /share?t=token）
  const params = new URLSearchParams(window.location.search);
  const stoken = params.get('share') || params.get('t');
  if(stoken){
    window.isShareMode = true;
    window.shareToken = stoken;
    document.body.classList.add('share-mode');
    document.getElementById('share-banner').style.display = 'block';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'flex';
    loadShareData(stoken);
    return;
  }

  // リダイレクト方式から戻ってきた場合の結果取得
  let redirectError = null;
  try{
    await getRedirectResult(auth);
  } catch(e){
    redirectError = e;
  }

  // ログインボタン: popup-first、失敗時はredirectにフォールバック
  document.getElementById('login-btn').onclick = async () => {
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    btn.disabled = true;
    errEl.classList.remove('show');
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt:'select_account' });

    // まずpopupを試す（モバイル含む全環境）
    try{
      await signInWithPopup(auth, provider);
      // 成功 → onAuthStateChanged で処理される
    } catch(popupErr){
      // popupが失敗 → redirectにフォールバック
      const fallbackCodes = [
        'auth/popup-blocked',
        'auth/popup-closed-by-user',
        'auth/cancelled-popup-request',
        'auth/operation-not-supported-in-this-environment',
        'auth/web-storage-unsupported'
      ];
      if(fallbackCodes.includes(popupErr.code)){
        try{
          await signInWithRedirect(auth, provider);
          // この時点でページがGoogleにリダイレクトされる
        } catch(redirectErr){
          btn.disabled = false;
          errEl.textContent = 'ログインに失敗しました: ' + (redirectErr.message || 'unknown');
          errEl.classList.add('show');
        }
      } else {
        // 通常のpopupエラー
        btn.disabled = false;
        errEl.textContent = 'ログインに失敗しました: ' + (popupErr.message || popupErr.code || 'unknown');
        errEl.classList.add('show');
      }
    }
  };

  // 認証状態の監視
  onAuthStateChanged(auth, async (user) => {
    if(!user){
      window.currentUser = null;
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app-shell').style.display = 'none';
      // 直前のリダイレクトでエラーが出ていた場合だけ表示
      if(redirectError){
        const errEl = document.getElementById('login-error');
        if(errEl){
          errEl.textContent = '前回のログイン処理でエラー: ' + (redirectError.message || 'unknown');
          errEl.classList.add('show');
        }
        redirectError = null;
      }
      // ログインボタンを再有効化
      const lbtn = document.getElementById('login-btn');
      if(lbtn) lbtn.disabled = false;
      return;
    }
    // 許可Emailチェック
    const email = (user.email || '').toLowerCase();
    if(!window.ALLOWED_EMAILS.map(e=>e.toLowerCase()).includes(email)){
      const errEl = document.getElementById('login-error');
      errEl.textContent = `${email} はこのシステムへのアクセス権がありません。`;
      errEl.classList.add('show');
      await signOut(auth);
      document.getElementById('login-btn').disabled = false;
      return;
    }
    window.currentUser = { uid:user.uid, email:user.email, name:user.displayName || user.email };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'flex';
    document.getElementById('user-chip').textContent = user.displayName || user.email;
    document.getElementById('drawer-user-name').textContent = user.displayName || user.email;
    await loadUserPrefs();
    await loadWells();
  });
});

};

async function loadUserPrefs(){
  const FB = window.FB;
  if(!window.currentUser) return;
  try{
    const ref = FB.doc(FB.db, 'wellSysUserPrefs', window.currentUser.uid);
    const snap = await FB.getDoc(ref);
    if(snap.exists()){
      const d = snap.data();
      window.userPrefs.staff = Array.isArray(d.staff) ? d.staff : ['野島'];
      window.userPrefs.customGeologies = Array.isArray(d.customGeologies) ? d.customGeologies : [];
      window.userPrefs.geologyOrder = Array.isArray(d.geologyOrder) ? d.geologyOrder : [];
      window.userPrefs.geologyPatterns = (d.geologyPatterns && typeof d.geologyPatterns === 'object') ? d.geologyPatterns : {};
      window.userPrefs.defaultHeadRodLengthM = (typeof d.defaultHeadRodLengthM === 'number') ? d.defaultHeadRodLengthM : null;
      window.userPrefs.defaultPipeLengthM = (typeof d.defaultPipeLengthM === 'number') ? d.defaultPipeLengthM : null;
      if(d.theme) window.applyTheme(d.theme);
    }
  } catch(e){
    // 初回ロードエラーは無視（新規ユーザーの場合）
  }
}
async function saveUserPrefs(){
  const FB = window.FB;
  if(!window.currentUser) return;
  try{
    const ref = FB.doc(FB.db, 'wellSysUserPrefs', window.currentUser.uid);
    await FB.setDoc(ref, window.sanitize({
      staff: window.userPrefs.staff,
      customGeologies: window.userPrefs.customGeologies,
      geologyOrder: window.userPrefs.geologyOrder || [],
      geologyPatterns: window.userPrefs.geologyPatterns || {},
      defaultHeadRodLengthM: window.userPrefs.defaultHeadRodLengthM,
      defaultPipeLengthM: window.userPrefs.defaultPipeLengthM,
      theme: window.userPrefs.theme,
      updatedAt: window.isoNow()
    }), { merge:true });
  } catch(e){
    showToast('設定の保存に失敗: ' + e.message, 'var(--red)');
  }
}
window.saveUserPrefs = saveUserPrefs;

async function loadWells(){
  const FB = window.FB;
  const body = document.getElementById('well-list-body');
  body.innerHTML = '<div class="loader-page"><span class="loader"></span>現場データを読み込み中…</div>';
  try{
    const q = FB.query(FB.collection(FB.db, 'wells'), FB.orderBy('updatedAt','desc'));
    const snap = await FB.getDocs(q);
    window.wells = [];
    snap.forEach(d => window.wells.push({ id:d.id, ...d.data() }));
    renderWellList();
  } catch(e){
    body.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">読み込み失敗: ${escAttr(e.message||'')}</div><button class="btn" onclick="window.loadWells()" type="button">再試行</button></div>`;
  }
}
window.loadWells = loadWells;

function renderWellList(){
  const body = document.getElementById('well-list-body');
  const search = (document.getElementById('well-search')?.value || '').toLowerCase().trim();
  const filter = document.getElementById('well-status-filter')?.value || '';
  let list = window.wells.slice();
  if(filter) list = list.filter(w => (w.status||'drilling') === filter);
  if(search) list = list.filter(w =>
    (w.siteName||'').toLowerCase().includes(search) ||
    (w.customerName||'').toLowerCase().includes(search) ||
    (w.address||'').toLowerCase().includes(search)
  );
  if(!list.length){
    body.innerHTML = `<div class="empty"><div class="empty-icon">🏞️</div><div class="empty-text">${window.wells.length===0 ? '現場がまだ登録されていません' : '該当する現場がありません'}</div>${window.wells.length===0 ? '<button class="btn btn-primary" onclick="openWellEdit(null)" type="button">＋ 最初の現場を作成</button>' : ''}</div>`;
    return;
  }
  const statusLabel = { draft:'下書き', drilling:'作業中', completed:'完了', archived:'アーカイブ' };
  body.innerHTML = '<div class="well-grid">' + list.map(w => {
    const st = w.status || 'drilling';
    const depth = w.finalDepthM != null ? Number(w.finalDepthM).toFixed(2) : (w.lastDepthM != null ? Number(w.lastDepthM).toFixed(2) : '0.00');
    const updated = w.updatedAt ? formatDateTime(w.updatedAt) : '';
    return `
    <div class="well-card" onclick="navigate('detail',{wellId:'${escAttr(w.id)}'})">
      <span class="well-status ${escAttr(st)}">${escAttr(statusLabel[st]||st)}</span>
      <div class="well-card-name" style="margin-top:6px">${escAttr(w.siteName||'(現場名なし)')}</div>
      <div class="well-card-cust">${escAttr(w.customerName||'')}　${escAttr(w.address||'')}</div>
      <div class="well-card-meta">
        <div>
          <div style="font-size:10px;color:var(--text3)">担当: ${escAttr(w.staff||'—')}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">更新: ${escAttr(updated)}</div>
        </div>
        <div class="well-card-depth">${escAttr(depth)}<small style="font-size:10px;font-weight:500">m</small></div>
      </div>
    </div>`;
  }).join('') + '</div>';
}
window.renderWellList = renderWellList;

function openWellEdit(wellId){
  closeDrawer();
  let w;
  if(wellId){
    w = window.wells.find(x => x.id === wellId);
    if(!w){ showToast('現場が見つかりません', 'var(--red)'); return; }
    w = JSON.parse(JSON.stringify(w));
  } else {
    w = {
      id: null,
      siteName:'', customerName:'', address:'',
      gps:null, staff: window.userPrefs.staff[0] || '',
      headRodLengthM: window.DEFAULT_HEAD_ROD_M,
      pipeLengthM: window.DEFAULT_PIPE_M,
      targetDepthM: '', note:'',
      status:'drilling', startedAt: window.isoNow(),
      sceneScenePhotos: [],
      siteScenePhotos: []
    };
  }
  window.editingWell = w;
  document.getElementById('well-modal-title').textContent = wellId ? '現場を編集' : '現場を新規作成';
  // ボタン状態リセット
  const wsBtn = document.getElementById('well-save-btn');
  if(wsBtn){ wsBtn.disabled = false; wsBtn.textContent = '保存'; }
  renderWellEditBody();
  document.getElementById('well-modal').classList.add('open');
}
window.openWellEdit = openWellEdit;

  const w = window.editingWell;
  if(!w) return;
  const staffOptions = window.userPrefs.staff.map(s =>
    `<option value="${escAttr(s)}" ${s===w.staff?'selected':''}>${escAttr(s)}</option>`
  ).join('');
  const photos = w.siteScenePhotos || [];
  const photoCells = photos.map((p,i) => `
    <div class="photo-cell">
      <img src="${escAttr(p.url)}" alt="現場${i+1}" onclick="openPhotoViewer('${escAttr(p.url)}','現場風景 ${i+1}/${photos.length}')">
      <button class="photo-cell-del" type="button" onclick="removeWellPhoto(${i})" aria-label="削除">✕</button>
    </div>
  `).join('');
  const addCell = photos.length < 10 ? `
    <label class="photo-add" title="現場風景を追加">
      ＋
      <input type="file" accept="image/*" multiple style="display:none" onchange="addWellPhotos(this.files);this.value=''">
    </label>` : '';
  const gpsRow = w.gps ?
    `<div class="gps-row"><span class="gps-coords">${Number(w.gps.lat).toFixed(5)}, ${Number(w.gps.lng).toFixed(5)}</span><span>±${Math.round(w.gps.accuracy||0)}m</span><button class="btn btn-sm btn-ghost" onclick="clearWellGPS()" type="button">クリア</button></div>` :
    `<button class="btn btn-sm" onclick="captureWellGPS()" type="button">📍 現在地を記録</button>`;

  document.getElementById('well-modal-body').innerHTML = `
    <div class="field">
      <label class="field-label field-label-req">現場名</label>
      <input class="input" id="we-siteName" type="text" value="${escAttr(w.siteName||'')}" placeholder="千歳市真町・佐藤様邸">
    </div>
    <div class="field">
      <label class="field-label">顧客名</label>
      <input class="input" id="we-customerName" type="text" value="${escAttr(w.customerName||'')}" placeholder="">
    </div>
    <div class="field">
      <label class="field-label">住所</label>
      <input class="input" id="we-address" type="text" value="${escAttr(w.address||'')}" placeholder="">
      <div class="field-hint">${gpsRow}</div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label">担当者</label>
        <select class="select" id="we-staff">
          ${staffOptions}
          <option value="">（未選択）</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">状態</label>
        <select class="select" id="we-status">
          <option value="draft" ${w.status==='draft'?'selected':''}>下書き</option>
          <option value="drilling" ${(w.status||'drilling')==='drilling'?'selected':''}>作業中</option>
          <option value="completed" ${w.status==='completed'?'selected':''}>完了</option>
          <option value="archived" ${w.status==='archived'?'selected':''}>アーカイブ</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label field-label-req">ドリルヘッド長 (m)</label>
        <input class="input" id="we-headRod" type="number" step="0.01" min="0.1" max="5" value="${escAttr(w.headRodLengthM)}">
        <div class="field-hint">1本目のロッド長（任意で個別設定）</div>
      </div>
      <div class="field">
        <label class="field-label field-label-req">追加ロッド長 (m)</label>
        <input class="input" id="we-pipe" type="number" step="0.01" min="0.1" max="5" value="${escAttr(w.pipeLengthM)}">
        <div class="field-hint">2本目以降の標準長</div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">目標深度 (m)</label>
      <input class="input" id="we-target" type="number" step="0.1" min="0" value="${escAttr(w.targetDepthM||'')}" placeholder="">
    </div>
    <div class="field">
      <label class="field-label">備考</label>
      <textarea class="textarea" id="we-note" placeholder="">${escAttr(w.note||'')}</textarea>
    </div>
    <div class="field">
      <label class="field-label">現場風景写真 (最大10枚)</label>
      <div class="photo-grid">
        ${photoCells}
        ${addCell}
      </div>
      <div class="photo-counter">${photos.length} / 10 枚</div>

}
window.renderWellEditBody = renderWellEditBody;

function closeWellEdit(){
  document.getElementById('well-modal').classList.remove('open');
  window.editingWell = null;
}
window.closeWellEdit = closeWellEdit;

// v1.3.1: フォーム値をstateに退避（再描画でフィールド値が消えるのを防ぐ）
function saveWellEditFieldsToState(){
  const w = window.editingWell;
  if(!w) return;
  const ids = [
    ['we-siteName', 'siteName'],
    ['we-customerName', 'customerName'],
    ['we-address', 'address'],
    ['we-staff', 'staff'],
    ['we-headRodLengthM', 'headRodLengthM', 'number'],
    ['we-pipeLengthM', 'pipeLengthM', 'number'],
    ['we-status', 'status'],
    ['we-note', 'note']
  ];
  ids.forEach(([id, key, type]) => {
    const el = document.getElementById(id);
    if(!el) return;
    const v = el.value;
    if(type === 'number'){
      const n = parseFloat(v);
      if(!isNaN(n)) w[key] = n;
    } else {
      w[key] = v;
    }
  });
}
window.saveWellEditFieldsToState = saveWellEditFieldsToState;

async function captureWellGPS(){
  // v1.3.1: 再描画前にフォームの入力値を退避
  saveWellEditFieldsToState();
  showToast('GPS取得中…', 'var(--blue)');
  try{
    const gps = await window.getGPS();
    window.editingWell.gps = gps;
    renderWellEditBody();
    showToast('現在地を記録しました');
  } catch(e){
    showToast(e.message || 'GPS取得失敗', 'var(--red)');
  }
}
window.captureWellGPS = captureWellGPS;

function clearWellGPS(){
  // v1.3.1: 再描画前にフォームの入力値を退避
  saveWellEditFieldsToState();
  window.editingWell.gps = null;
  renderWellEditBody();
}
window.clearWellGPS = clearWellGPS;

async function addWellPhotos(files){
  const w = window.editingWell;
  if(!w) return;
  // v1.3.1: 再描画前にフォーム値を退避
  saveWellEditFieldsToState();
  const existing = w.siteScenePhotos || [];
  const remain = 10 - existing.length;
  const list = Array.from(files).slice(0, remain);
  if(list.length === 0){
    showToast('写真は最大10枚です', 'var(--orange)');
    return;
  }
  // 現場新規作成時はまだIDがない → 仮ID
  if(!w.id) w.id = window.genId('w_');
  showToast(`${list.length}枚をアップロード中…`, 'var(--blue)');
  let success = 0, failed = 0;
  for(const f of list){
    try{
      const blob = await window.compressImage(f);
      const fileName = `scene_${Date.now()}_${Math.random().toString(36).substr(2,5)}.jpg`;
      const path = `wells/${w.id}/scene/${fileName}`;
      const sref = window.FB.ref(window.FB.storage, path);
      await Promise.race([
        window.FB.uploadBytes(sref, blob, { contentType:'image/jpeg' }),
        new Promise((_,rej) => setTimeout(()=>rej(new Error('Storage uploadBytes timeout(60s)')), 60000))
      ]);
      const url = await Promise.race([
        window.FB.getDownloadURL(sref),
        new Promise((_,rej) => setTimeout(()=>rej(new Error('getDownloadURL timeout(30s)')), 30000))
      ]);
      existing.push({ url, path, addedAt: window.isoNow() });
      success++;
    } catch(e){
      failed++;
      if(failed === 1) showToast('写真アップロード失敗: ' + (e.message||e), 'var(--red)');
    }
  }
  w.siteScenePhotos = existing;
  renderWellEditBody();
  if(failed === 0) showToast(`${success}枚をアップロードしました`);
  else if(success > 0) showToast(`${success}枚成功 / ${failed}枚失敗`, 'var(--orange)');
}
window.addWellPhotos = addWellPhotos;

async function removeWellPhoto(index){
  const w = window.editingWell;
  if(!w || !w.siteScenePhotos) return;
  // v1.3.1: 再描画前にフォーム値を退避
  saveWellEditFieldsToState();
  const photo = w.siteScenePhotos[index];
  if(!photo) return;
  showConfirm('この写真を削除しますか？', async () => {
    try{
      if(photo.path){
        const sref = window.FB.ref(window.FB.storage, photo.path);
        await window.FB.deleteObject(sref).catch(()=>{}); // 既に消えていてもOK
      }
      w.siteScenePhotos.splice(index, 1);
      renderWellEditBody();
      showToast('削除しました');
    } catch(e){
      showToast('削除失敗: ' + e.message, 'var(--red)');
    }
  });
}
window.removeWellPhoto = removeWellPhoto;

async function saveWell(){
  const w = window.editingWell;
  if(!w) return;
  const siteName = document.getElementById('we-siteName').value.trim();
  if(!siteName){ showToast('現場名は必須です', 'var(--red)'); return; }
  const headRod = Number(document.getElementById('we-headRod').value);
  const pipe = Number(document.getElementById('we-pipe').value);
  if(!(headRod > 0 && headRod < 10)){ showToast('ドリルヘッド長が不正です', 'var(--red)'); return; }
  if(!(pipe > 0 && pipe < 10)){ showToast('追加ロッド長が不正です', 'var(--red)'); return; }

  // 既存編集時はパイプ長変更を警告
  if(w.id){
    const existing = window.wells.find(x => x.id === w.id);
    if(existing && (existing.headRodLengthM !== headRod || existing.pipeLengthM !== pipe)){
      const hasRods = (window.currentRods || []).length > 0 || existing.rodCount > 0;
      if(hasRods){
        const ok = await new Promise(res => showConfirm(
          'ヘッド長またはロッド長を変更すると、既存ロッドの深度が変わります。\nよろしいですか？',
          ()=>res(true), ()=>res(false)
        ));
        if(!ok) return;
      }
    }
  }

  w.siteName = siteName;
  w.customerName = document.getElementById('we-customerName').value.trim();
  w.address = document.getElementById('we-address').value.trim();
  w.staff = document.getElementById('we-staff').value;
  w.status = document.getElementById('we-status').value;
  w.headRodLengthM = headRod;
  w.pipeLengthM = pipe;
  const target = document.getElementById('we-target').value.trim();
  w.targetDepthM = target ? Number(target) : null;
  w.note = document.getElementById('we-note').value.trim();

  const isNew = !w.id || !window.wells.find(x => x.id === w.id);
  window.stampAudit(w, isNew);
  if(!w.id) w.id = window.genId('w_');

  const btn = document.getElementById('well-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  let saved = false;
  try{
    const ref = window.FB.doc(window.FB.db, 'wells', w.id);
    const data = window.sanitize({ ...w });
    delete data.id;
    await Promise.race([
      window.FB.setDoc(ref, data, { merge:false }),
      new Promise((_,rej) => setTimeout(()=>rej(new Error('Firestore書き込みがタイムアウト(60秒)')), 60000))
    ]);
    saved = true;
    closeWellEdit();
    await loadWells();
    showToast(isNew ? '現場を作成しました' : '現場を更新しました');
    if(!isNew && window.currentWell && window.currentWell.id === w.id){
      navigate('detail', { wellId:w.id });
    }
  } catch(e){
    showToast('保存失敗: ' + (e.message || e), 'var(--red)');
  } finally {
    if(!saved){
      btn.disabled = false; btn.textContent = '保存';
    }
  }
}
window.saveWell = saveWell;

async function deleteWell(wellId){
  showConfirm('この現場と全てのロッド・地質・写真を完全に削除します。\n本当によろしいですか？', async () => {
    try{
      // ロッドとそれに紐づく地質・写真を削除
      const rodsCol = window.FB.collection(window.FB.db, 'wells', wellId, 'rods');
      const rodsSnap = await window.FB.getDocs(rodsCol);
      const batch = window.FB.writeBatch(window.FB.db);
      const photoPaths = [];
      rodsSnap.forEach(d => {
        const data = d.data();
        (data.geologies || []).forEach(g => {
          (g.photos || []).forEach(p => { if(p.path) photoPaths.push(p.path); });
        });
        batch.delete(d.ref);
      });
      // 現場本体
      const wref = window.FB.doc(window.FB.db, 'wells', wellId);
      const wsnap = await window.FB.getDoc(wref);
      if(wsnap.exists()){
        const wd = wsnap.data();
        (wd.siteScenePhotos || []).forEach(p => { if(p.path) photoPaths.push(p.path); });
      }
      batch.delete(wref);
      await batch.commit();
      // Storage削除（並列、失敗は無視）
      await Promise.all(photoPaths.map(p =>
        window.FB.deleteObject(window.FB.ref(window.FB.storage, p)).catch(()=>{})
      ));
      navigate('list');
      await loadWells();
      showToast('現場を削除しました');
    } catch(e){
      showToast('削除失敗: ' + e.message, 'var(--red)');
    }
  });
}
window.deleteWell = deleteWell;
</script>

<script>
// ============================================================
// 現場詳細 + 地層プレビュー
// ============================================================
async function loadWellDetail(wellId){
  const body = document.getElementById('detail-body');
  body.innerHTML = '<div class="loader-page"><span class="loader"></span>読み込み中…</div>';
  try{
    const wref = window.FB.doc(window.FB.db, 'wells', wellId);
    const wsnap = await window.FB.getDoc(wref);
    if(!wsnap.exists()){
      body.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">現場が見つかりません</div></div>';
      return;
    }
    window.currentWell = { id:wsnap.id, ...wsnap.data() };
    const rodsCol = window.FB.collection(window.FB.db, 'wells', wellId, 'rods');
    const rsnap = await window.FB.getDocs(window.FB.query(rodsCol, window.FB.orderBy('rodNum','asc')));
    window.currentRods = [];
    rsnap.forEach(d => window.currentRods.push({ id:d.id, ...d.data() }));
    renderDetail();
    // v1.3.0: バックグラウンドで地質情報を取得（未取得の場合のみ）
    if(!window.isShareMode && !window.currentWell.geoInfo){
      // 描画後、画面を阻害しないように非同期実行
      setTimeout(async () => {
        try{
          await window.fetchAndSaveGeoInfo(window.currentWell, false);
          // 取得完了後、もし地質情報セクションが展開されていたら再描画
          const card = document.getElementById('geo-info-card-inner');
          if(card && window.currentWell){
            card.innerHTML = renderGeoInfoSection(window.currentWell);
            if(window._geoInfoExpanded === window.currentWell.id){
              setTimeout(() => initGeoMap(window.currentWell), 80);
            }
          }
        } catch(e){
          console.warn('background geoInfo fetch failed:', e);
        }
      }, 600);
    }
  } catch(e){
    body.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">読み込み失敗: ${escAttr(e.message||'')}</div></div>`;
  }
}
window.loadWellDetail = loadWellDetail;

async function loadShareData(token){
  const body = document.getElementById('detail-body');
  body.innerHTML = '<div class="loader-page"><span class="loader"></span>共有データを読み込み中…</div>';
  document.getElementById('page-list').classList.remove('active');
  document.getElementById('page-detail').classList.add('active');
  try{
    const sref = window.FB.doc(window.FB.db, 'wellShares', token);
    const ssnap = await window.FB.getDoc(sref);
    if(!ssnap.exists()){
      body.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">共有リンクが無効です</div></div>';
      return;
    }
    const sd = ssnap.data();
    if(sd.expireAt && new Date(sd.expireAt) < new Date()){
      body.innerHTML = '<div class="empty"><div class="empty-icon">⏱</div><div class="empty-text">この共有リンクは期限切れです</div></div>';
      return;
    }
    // v1.2.1: 共有モードでもカスタム地質が正しく解決できるよう、
    //         共有スナップショットからuserPrefsにカスタム地質情報を注入
    // v1.2.2: パターン情報も注入
    if(Array.isArray(sd.customGeologies)){
      window.userPrefs.customGeologies = sd.customGeologies;
    }
    if(Array.isArray(sd.geologyOrder)){
      window.userPrefs.geologyOrder = sd.geologyOrder;
    }
    if(sd.geologyPatterns && typeof sd.geologyPatterns === 'object'){
      window.userPrefs.geologyPatterns = sd.geologyPatterns;
    }
    const wref = window.FB.doc(window.FB.db, 'wells', sd.wellId);
    const wsnap = await window.FB.getDoc(wref);
    if(!wsnap.exists()){
      body.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">現場データがありません</div></div>';
      return;
    }
    window.currentWell = { id:wsnap.id, ...wsnap.data() };
    const rodsCol = window.FB.collection(window.FB.db, 'wells', sd.wellId, 'rods');
    const rsnap = await window.FB.getDocs(window.FB.query(rodsCol, window.FB.orderBy('rodNum','asc')));
    window.currentRods = [];
    rsnap.forEach(d => window.currentRods.push({ id:d.id, ...d.data() }));
    renderDetail();
  } catch(e){
    body.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">共有データの読み込みに失敗: ${escAttr(e.message||'')}</div></div>`;
  }
}

function setGeoInfoSubtab(name){

    );

}

// v1.3.4: 地表地質と標高から水源深度の傾向を予測
function predictWaterSource(sg, el){
  if(!sg || sg.fetchStatus !== 'ok' || !sg.lithology_ja){
    return ''; // データなしの場合は表示しない
  }
  const lith = sg.lithology_ja;
  const elev = (el && el.fetchStatus === 'ok') ? el.meters : null;
  let category = 'unknown';
  let shallow = '';
  let deep = '';
  let note = '';
  let bgColor = '#f0f4f8';
  let borderColor = '#5a8bbf';

  // 地質パターンマッチング
  if(lith.includes('湿原') || lith.includes('湿地') || lith.includes('沼沢') || lith.includes('泥炭')){
    category = '湿地・泥炭地';
    shallow = '2〜8m（地下水位が浅く、井戸は容易に水を得られる傾向）';
    deep = '30〜80m（深層礫質帯水層、より清浄で安定した水質）';
    note = '軟弱地盤のため掘削時の崩壊・水の濁りに注意。岩盤までは比較的深い傾向。';
    bgColor = '#e8f4ee';
    borderColor = '#2d8659';
  } else if(lith.includes('谷底') || lith.includes('河川') || lith.includes('氾濫') || lith.includes('河岸') || lith.includes('扇状地')){
    category = '河川・氾濫平野';
    shallow = '3〜10m（伏流水・浅層地下水が豊富）';
    deep = '15〜60m（旧河道に礫質帯水層がある可能性）';
    note = '砂・礫が多く井戸に適した地質。ただし水位の季節変動がある場合あり。';
    bgColor = '#e8f1f5';
    borderColor = '#2c6a8e';
  } else if(lith.includes('海岸平野') || lith.includes('海浜') || lith.includes('砂丘')){
    category = '海岸平野・砂丘';
    shallow = '5〜15m（砂層内の浅層地下水）';
    deep = '20〜80m（深層帯水層）';
    note = '海岸近くの場合は塩水化のリスクあり。揚水量に注意。';
    bgColor = '#fef8e7';
    borderColor = '#c89c1e';
  } else if(lith.includes('段丘') || lith.includes('台地') || lith.includes('丘陵')){
    category = '段丘・台地';
    shallow = '10〜30m（粘土質が多く浅層は水量が少ない場合）';
    deep = '40〜100m以上（深部の砂礫層を狙う必要がある）';
    note = '掘削深度が深くなる傾向。事前のボーリング調査で帯水層位置の確認が望ましい。';
    bgColor = '#f4f0e8';
    borderColor = '#8e6c2c';
  } else if(lith.includes('火砕流') || lith.includes('火山灰') || lith.includes('火山砕屑')){
    category = '火山堆積物';
    shallow = '15〜40m（透水性により変動大）';
    deep = '50〜120m（基盤岩までの距離が大きい場合あり）';
    note = '透水性が場所により大きく異なる。近隣の事例調査が重要。';
    bgColor = '#f5ece8';
    borderColor = '#9c4e2c';
  } else if(lith.includes('花崗岩') || lith.includes('閃緑岩') || lith.includes('片麻岩')){
    category = '深成岩';
    shallow = '一般に乏水（亀裂帯水層に依存）';
    deep = '50〜200m（亀裂・破砕帯を当てる必要）';
    note = '岩盤井戸は深掘削が必要で、水脈位置の予測が困難。';
    bgColor = '#ece8f0';
    borderColor = '#5e3e8e';
  } else if(lith.includes('堆積岩') || lith.includes('砂岩') || lith.includes('泥岩') || lith.includes('礫岩')){
    category = '堆積岩';
    shallow = '層境界付近で帯水層あり（深度はばらつき大）';
    deep = '40〜150m（透水層を見極める必要）';
    note = '層理の傾斜により水脈位置が大きく変わる。掘削計画は慎重に。';
    bgColor = '#f0ebe8';
    borderColor = '#8e6e2c';
  } else {
    category = lith;
    shallow = '不明（地質によります）';
    deep = '不明（地質によります）';
    note = '一般的な目安は出せません。近隣の井戸事例やボーリング記録の確認をおすすめします。';
  }

  // 標高による補足
  let elevNote = '';
  if(elev != null){
    if(elev < 10){
      elevNote = '低地（標高'+elev+'m）：地下水位が浅く、湧水量が多い傾向。';
    } else if(elev < 50){
      elevNote = '低台地（標高'+elev+'m）：浅層・中層地下水ともに期待できる地形。';
    } else if(elev < 200){
      elevNote = '台地（標高'+elev+'m）：浅層水は限定的。中〜深層を狙うと安定。';
    } else {
      elevNote = '高地（標高'+elev+'m）：深層井戸が中心。事前調査推奨。';
    }
  }

  return `
    <div class="geo-info-block" style="background:${bgColor};border-left:4px solid ${borderColor}">
      <div class="geo-info-block-title">💧 水源深度の傾向（参考情報）</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:8px">
        <strong>地質分類:</strong> ${escAttr(category)}
      </div>
      <div class="water-prediction-row">
        <div class="water-prediction-label">浅井戸の目安</div>
        <div class="water-prediction-value">${escAttr(shallow)}</div>
      </div>
      <div class="water-prediction-row">
        <div class="water-prediction-label">深井戸の目安</div>
        <div class="water-prediction-value">${escAttr(deep)}</div>
      </div>
      ${elevNote ? `<div class="water-prediction-elevnote">📍 ${escAttr(elevNote)}</div>` : ''}
      <div class="water-prediction-note">⚠ ${escAttr(note)}</div>
      <div class="geo-info-source" style="margin-top:8px">
        ※ あくまで地質分類による一般的な傾向です。実際の水源深度は周辺の井戸事例やボーリング調査で確認してください。
      </div>
    </div>`;
}
window.predictWaterSource = predictWaterSource;

// 表示切替

  const w = window.currentWell;

  if(window._geoInfoExpanded === w.id){

// 手動更新
async function refreshGeoInfo(){
  const w = window.currentWell;

// マップ初期化
function initGeoMap(w, retryCount){
  retryCount = retryCount || 0;
  // v1.3.3: Leaflet未ロード時は最大10回リトライ（合計約3秒待機）
  if(typeof L === 'undefined'){
    if(retryCount < 10){
      setTimeout(() => initGeoMap(w, retryCount + 1), 300);
    } else {
      const el = document.getElementById('geo-info-map');
      if(el){
        el.innerHTML = `
          <div style="padding:24px;text-align:center;color:#666;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:12px">
            <div>⚠ マップライブラリを読み込めませんでした</div>
            <div style="font-size:11px;color:#999">ネットワーク状況やキャッシュが原因の可能性があります</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
              <button class="btn btn-sm btn-primary" onclick="retryGeoMap()" type="button">🔄 マップを再読み込み</button>
              <button class="btn btn-sm" onclick="location.reload()" type="button">⟳ ページ再読み込み</button>
            </div>
          </div>`;
      }
    }
    return;
  }
  const el = document.getElementById('geo-info-map');
  if(!el){
    // 要素未生成（タブ未展開）の場合、少し待ってリトライ
    if(retryCount < 5){
      setTimeout(() => initGeoMap(w, retryCount + 1), 200);
    }
    return;
  }
  if(!w || !w.geoInfo || !w.geoInfo.coord){
    el.innerHTML = '<div style="padding:20px;text-align:center;color:#888;font-size:12px">座標未取得のためマップを表示できません</div>';
    return;
  }
  const { lat, lng } = w.geoInfo.coord;
  // v1.3.3: 既存インスタンス破棄＋DOMもクリア
  if(window._geoMapInstance){
    try{ window._geoMapInstance.remove(); } catch(e){}
    window._geoMapInstance = null;
  }
  el.innerHTML = ''; // Leafletの古い内部DOMをクリア
  // v1.3.3: コンテナの実際のサイズを確認、0なら少し待つ
  if(el.offsetWidth === 0 || el.offsetHeight === 0){
    if(retryCount < 5){
      setTimeout(() => initGeoMap(w, retryCount + 1), 200);
    }
    return;
  }
  try{
    const map = L.map(el, { zoomControl: true, attributionControl: true }).setView([lat, lng], 16);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>',
      maxZoom: 18
    }).addTo(map);
    L.marker([lat, lng]).addTo(map).bindPopup(escAttr(w.siteName || '現場')).openPopup();
    window._geoMapInstance = map;
    // v1.3.3: サイズ再計算（タブ切替で表示された後の調整）
    setTimeout(() => {
      try{ map.invalidateSize(); } catch(e){}
    }, 100);
    setTimeout(() => {
      try{ map.invalidateSize(); } catch(e){}
    }, 500);
  } catch(e){
    console.error('initGeoMap failed:', e);
    el.innerHTML = '<div style="padding:20px;text-align:center;color:#c00;font-size:12px">マップ初期化エラー: ' + escAttr(e.message||'') + '</div>';
  }
}

// v1.3.4: マップ再試行（Leafletを動的に読み込み直す）
function retryGeoMap(){
  const el = document.getElementById('geo-info-map');
  if(el){
    el.innerHTML = '<div style="padding:24px;text-align:center;color:#888;font-size:12px"><span class="loader"></span> マップを再読み込み中…</div>';
  }
  // Leafletが既に読み込まれていればすぐ初期化
  if(typeof L !== 'undefined' && window.currentWell){
    setTimeout(() => initGeoMap(window.currentWell), 100);
    return;
  }
  // 動的にLeafletを読み込み（SRIなしで読み込んでフォールバック）
  // CSS
  if(!document.querySelector('link[href*="leaflet.css"]:not([data-retry])')){
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    link.crossOrigin = '';
    link.dataset.retry = '1';
    document.head.appendChild(link);
  }
  // JS
  if(typeof L === 'undefined'){
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.crossOrigin = '';
    script.dataset.retry = '1';
    script.onload = () => {
      if(window.currentWell){
        setTimeout(() => initGeoMap(window.currentWell), 200);
      }
    };
    script.onerror = () => {
      if(el){
        el.innerHTML = '<div style="padding:24px;text-align:center;color:#c00;font-size:12px">再読み込みも失敗しました。ネットワーク接続を確認してください。</div>';
      }
    };
    document.head.appendChild(script);
  }
}
window.retryGeoMap = retryGeoMap;

function openGeoMapFullscreen(){
  const w = window.currentWell;
  if(!w || !w.geoInfo || !w.geoInfo.coord) return;
  const { lat, lng } = w.geoInfo.coord;
  // 全画面オーバーレイを動的生成
  let overlay = document.getElementById('geo-map-fullscreen');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'geo-map-fullscreen';
    overlay.className = 'geo-map-fullscreen';
    overlay.innerHTML = `
      <div class="geo-map-fullscreen-head">
        <span>🗺 ${escAttr(w.siteName || '現場')}</span>

      </div>
      <div id="geo-map-fullscreen-body" class="geo-map-fullscreen-body"></div>
    `;
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  // v1.3.3: Leafletロード待ちリトライ付き
  const tryInit = (retry) => {
    retry = retry || 0;
    if(typeof L === 'undefined'){
      if(retry < 10){ setTimeout(() => tryInit(retry+1), 300); }
      return;
    }
    if(window._geoMapFullscreenInstance){
      try{ window._geoMapFullscreenInstance.remove(); } catch(e){}
      window._geoMapFullscreenInstance = null;
    }

    el.innerHTML = '';

  };

}

// 相対時刻フォーマット
function formatRelativeTime(iso){
  if(!iso) return '未取得';
  try{
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if(diffMin < 1) return 'たった今';
    if(diffMin < 60) return `${diffMin}分前`;
    const diffH = Math.floor(diffMin / 60);
    if(diffH < 24) return `${diffH}時間前`;
    const diffD = Math.floor(diffH / 24);
    if(diffD < 30) return `${diffD}日前`;
    return d.toLocaleDateString('ja-JP');
  } catch(e){ return iso; }
}

// 地質情報モジュール（v1.3.0）
// 産総研シームレス地質図 + 地理院標高API + 地理院ジオコーダー
// ============================================================

const GEO_API_TIMEOUT_MS = 15000;

// 共通: タイムアウト付きfetch
function geoFetch(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const controller = new AbortController();
    const timer = setTimeout(() => { controller.abort(); reject(new Error('タイムアウト')); }, timeoutMs || GEO_API_TIMEOUT_MS);
    fetch(url, { signal: controller.signal })
      .then(r => {
        clearTimeout(timer);
        if(!r.ok) reject(new Error('HTTP ' + r.status));
        else resolve(r.json());
      })
      .catch(e => { clearTimeout(timer); reject(e); });
  });
}

// 住所 → 緯度経度
async function geocodeByAddress(address){
  if(!address || !address.trim()) return null;
  const url = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(address.trim());
  try{
    const data = await geoFetch(url);
    if(Array.isArray(data) && data.length > 0 && data[0].geometry && data[0].geometry.coordinates){
      const [lon, lat] = data[0].geometry.coordinates;
      return { lat, lng: lon, source: 'address', title: data[0].properties?.title || '' };
    }
    return null;
  } catch(e){
    console.warn('geocodeByAddress failed:', e);
    return null;
  }
}

// 緯度経度 → 標高
async function fetchElevation(lat, lng){
  const url = `https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lng}&lat=${lat}&outtype=JSON`;
  try{
    const data = await geoFetch(url);
    if(typeof data.elevation === 'number'){
      return { meters: data.elevation, hsrc: data.hsrc || '', fetchStatus: 'ok' };
    }
    return { fetchStatus: 'failed', error: 'データなし' };
  } catch(e){
    return { fetchStatus: 'failed', error: e.message };
  }
}

// 緯度経度 → 地表地質
async function fetchSurfaceGeology(lat, lng){
  const url = `https://gbank.gsj.jp/seamless/v2/api/1.2/legend.json?point=${lat},${lng}`;
  try{
    const data = await geoFetch(url);
    if(data.symbol){
      return {
        symbol: data.symbol,
        formationAge_ja: data.formationAge_ja || '',
        formationAge_en: data.formationAge_en || '',
        group_ja: data.group_ja || '',
        lithology_ja: data.lithology_ja || '',
        lithology_en: data.lithology_en || '',
        colorRgb: { r: data.r||0, g: data.g||0, b: data.b||0 },
        fetchStatus: 'ok'
      };
    }
    return { fetchStatus: 'failed', error: 'データなし' };
  } catch(e){
    return { fetchStatus: 'failed', error: e.message };
  }
}

// 現場の座標を決定（GPS優先 → 住所）
async function resolveWellCoord(well){
  if(well.gpsLat != null && well.gpsLng != null){
    return { lat: parseFloat(well.gpsLat), lng: parseFloat(well.gpsLng), source: 'gps' };
  }
  if(well.address){
    const r = await geocodeByAddress(well.address);
    if(r) return r;
  }
  return null;
}

// 地質情報の一括取得＆Firestore保存
async function fetchAndSaveGeoInfo(well, force){
  if(!well || !well.id) return null;
  // 共有モードでは取得しない
  if(window.isShareMode) return well.geoInfo || null;
  // 強制取得でない場合、既に取得済みなら再利用（手動更新ボタンで強制）
  if(!force && well.geoInfo && well.geoInfo.fetchedAt){
    return well.geoInfo;
  }
  const coord = await resolveWellCoord(well);
  if(!coord){
    const partial = {
      fetchedAt: window.isoNow(),
      fetchedFromCoord: 'none',
      coord: null,
      surfaceGeology: { fetchStatus: 'failed', error: 'GPS座標も住所も未設定' },
      elevation: { fetchStatus: 'failed', error: 'GPS座標も住所も未設定' }
    };
    well.geoInfo = partial;
    await persistGeoInfo(well, partial);
    return partial;
  }
  // 並列取得
  const [elev, geo] = await Promise.all([
    fetchElevation(coord.lat, coord.lng),
    fetchSurfaceGeology(coord.lat, coord.lng)
  ]);
  const geoInfo = {
    fetchedAt: window.isoNow(),
    fetchedFromCoord: coord.source,
    coord: { lat: coord.lat, lng: coord.lng },
    surfaceGeology: geo,
    elevation: elev
  };
  well.geoInfo = geoInfo;
  await persistGeoInfo(well, geoInfo);
  return geoInfo;
}

async function persistGeoInfo(well, geoInfo){
  if(window.isShareMode) return;
  if(!well || !well.id) return;
  try{
    const ref = window.FB.doc(window.FB.db, 'wells', well.id);
    await window.FB.updateDoc(ref, window.sanitize({
      geoInfo: geoInfo,
      updatedAt: window.isoNow()
    }));
  } catch(e){
    console.warn('persistGeoInfo failed:', e);
  }
}

window.fetchAndSaveGeoInfo = fetchAndSaveGeoInfo;
