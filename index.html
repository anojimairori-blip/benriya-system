// ロッド追加（次のロッド番号を自動採番、地質は空で作成）
// ============================================================
async function addNextRod(){
  const w = window.currentWell;
  if(!w) return;
  const rods = window.currentRods || [];
  const nextNum = rods.reduce((m, r) => Math.max(m, r.rodNum||0), 0) + 1;
  const rod = {
    id: window.genId('r_'),
    rodNum: nextNum,
    geologies: [],
    recordedAt: window.isoNow(),
    gps: null
  };
  window.stampAudit(rod, true);
  try{
    const ref = window.FB.doc(window.FB.db, 'wells', w.id, 'rods', rod.id);
    const data = window.sanitize({ ...rod });
    delete data.id;
    await Promise.race([
      window.FB.setDoc(ref, data, { merge:false }),
      new Promise((_,rej) => setTimeout(()=>rej(new Error('Firestore書き込みがタイムアウト(60秒)')), 60000))
    ]);
    // 親現場の更新
    const newMax = window.rodDepth(w.headRodLengthM, w.pipeLengthM, nextNum);
    const wref = window.FB.doc(window.FB.db, 'wells', w.id);
    await window.FB.updateDoc(wref, window.sanitize({
      lastDepthM: newMax,
      rodCount: nextNum,
      updatedAt: window.isoNow(),
      updatedBy: window.currentUser ? window.currentUser.email : 'unknown'
    }));
    showToast(`ロッド ${nextNum}本目を追加しました`);
    await loadWellDetail(w.id);
    // 自動的に編集モーダルを開く
    openRodEdit(rod.id);
  } catch(e){
    showToast('ロッド追加失敗: ' + (e.message || e), 'var(--red)');
  }
}
window.addNextRod = addNextRod;

// ============================================================
// ロッド編集モーダル（地質一覧、追加、編集、削除、ロッド削除）
// ============================================================
function openRodEdit(rodId){
  const w = window.currentWell;
  if(!w) return;
  const rod = window.currentRods.find(r => r.id === rodId);
  if(!rod){ showToast('ロッドが見つかりません', 'var(--red)'); return; }
  window.editingRod = JSON.parse(JSON.stringify(rod));
  document.getElementById('rod-modal-title').textContent = `ロッド ${rod.rodNum}本目`;
  renderRodEditBody();
  document.getElementById('rod-modal').classList.add('open');
  // モーダル本体をトップにスクロール
  setTimeout(() => {
    const body = document.getElementById('rod-modal-body');
    if(body) body.scrollTop = 0;
  }, 50);
}
window.openRodEdit = openRodEdit;

function closeRodEdit(){
  document.getElementById('rod-modal').classList.remove('open');
  window.editingRod = null;
  // 詳細ページのプレビューを再描画（地質追加後の反映用）
  if(window.currentWell && typeof window.renderDetail === 'function'){
    window.renderDetail();
  }
}
window.closeRodEdit = closeRodEdit;

function renderRodEditBody(){
  const rod = window.editingRod;
  const w = window.currentWell;
  if(!rod || !w) return;
  const range = window.rodRange(w.headRodLengthM, w.pipeLengthM, rod.rodNum);
  const fromM = range[0];
  const toM = range[1];
  const segLen = toM - fromM;
  const geos = rod.geologies || [];
  const remain = window.MAX_GEOLOGIES_PER_ROD - geos.length;

  const each = geos.length > 0 ? (segLen / geos.length) : 0;
  const geoListHtml = geos.map((g, idx) => {
    const meta = window.getGeologyByKey(g.geology || 'soil');
    const label = g.geology === 'other' && g.geologyCustom ? g.geologyCustom : meta.label;
    const subFrom = fromM + each * idx;
    const subTo = fromM + each * (idx + 1);
    const photos = g.photos || [];
    const photoThumbs = photos.slice(0, 5).map(p =>
      `<img src="${escAttr(p.url)}" class="log-row-thumb" alt="">`
    ).join('');
    return `
      <div class="geo-entry-card">
        <div class="geo-entry-bar" style="background-color:${escAttr(meta.color)}"></div>
        <div class="geo-entry-body">
          <div class="geo-entry-head">
            <strong>${escAttr(label)}</strong>
            <span class="geo-entry-range">${subFrom.toFixed(2)}〜${subTo.toFixed(2)}m</span>
          </div>
          ${g.note ? `<div class="geo-entry-note">${escAttr(g.note)}</div>` : ''}
          ${photoThumbs ? `<div class="geo-entry-photos">${photoThumbs}</div>` : ''}
          <div class="geo-entry-actions">
            <button class="btn btn-sm" type="button" onclick="openGeologyEdit(${idx})">編集</button>
            <button class="btn btn-sm btn-ghost" type="button" onclick="removeGeologyEntry(${idx})" style="color:var(--red)">削除</button>
          </div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('rod-modal-body').innerHTML = `
    <div class="rod-info-card">
      <div class="rod-info-row"><span>区間</span><strong>${fromM.toFixed(2)} 〜 ${toM.toFixed(2)} m</strong></div>
      <div class="rod-info-row"><span>長さ</span><strong>${segLen.toFixed(2)} m</strong></div>
      <div class="rod-info-row"><span>地質数</span><strong>${geos.length} / ${window.MAX_GEOLOGIES_PER_ROD}</strong></div>
    </div>

    <div class="section-title" style="margin-top:14px">登録済みの地質</div>
    ${geos.length === 0 ? `<div class="empty" style="padding:18px"><div class="empty-text">地質がまだ登録されていません</div></div>` : `<div class="geo-entry-list">${geoListHtml}</div>`}

    ${remain > 0 ? `
      <button class="btn btn-primary btn-block" type="button" onclick="openGeologyEdit(-1)" style="margin-top:12px">
        ＋ 地質を追加 （あと${remain}つまで）
      </button>` :
      `<div class="field-hint" style="margin-top:12px;text-align:center">これ以上は追加できません（最大${window.MAX_GEOLOGIES_PER_ROD}つ）</div>`
    }

    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
      <button class="btn btn-danger btn-block" type="button" onclick="deleteRod('${escAttr(rod.id)}')">
        🗑 このロッドを削除
      </button>
    </div>
  `;
}
window.renderRodEditBody = renderRodEditBody;

async function deleteRod(rodId){
  const w = window.currentWell;
  if(!w) return;
  const rod = window.currentRods.find(r => r.id === rodId);
  if(!rod) return;
  showConfirm(`ロッド ${rod.rodNum}本目とその地質・写真を全て削除します。\nよろしいですか？\n\n※ロッド番号の振り直しは行われません`, async () => {
    try{
      // 写真削除
      const photoPaths = [];
      (rod.geologies || []).forEach(g => {
        (g.photos || []).forEach(p => { if(p.path) photoPaths.push(p.path); });
      });
      const ref = window.FB.doc(window.FB.db, 'wells', w.id, 'rods', rodId);
      await window.FB.deleteDoc(ref);
      await Promise.all(photoPaths.map(p =>
        window.FB.deleteObject(window.FB.ref(window.FB.storage, p)).catch(()=>{})
      ));
      closeRodEdit();
      await loadWellDetail(w.id);
      showToast('ロッドを削除しました');
    } catch(e){
      showToast('削除失敗: ' + (e.message||e), 'var(--red)');
    }
  });
}
window.deleteRod = deleteRod;

// ============================================================
// 地質エントリ編集モーダル
// ============================================================
function openGeologyEdit(index){
  // index: -1=新規, 0以上=編集
  const rod = window.editingRod;
  if(!rod) return;
  const geos = rod.geologies || [];
  if(index === -1){
    if(geos.length >= window.MAX_GEOLOGIES_PER_ROD){
      showToast(`地質は最大${window.MAX_GEOLOGIES_PER_ROD}つまでです`, 'var(--orange)');
      return;
    }
    window.editingGeology = {
      _index: -1,
      geology: 'soil',
      geologyCustom: '',
      note: '',
      photos: [],
      addedAt: window.isoNow()
    };
  } else {
    const g = geos[index];
    if(!g){ showToast('地質エントリが見つかりません', 'var(--red)'); return; }
    window.editingGeology = JSON.parse(JSON.stringify(g));
    window.editingGeology._index = index;
  }
  document.getElementById('geo-modal-title').textContent = index === -1 ? '地質を追加' : '地質を編集';
  document.getElementById('geo-delete-btn').style.display = index === -1 ? 'none' : '';
  // 保存ボタンリセット
  const sb = document.getElementById('geo-save-btn');
  if(sb){ sb.disabled = false; sb.textContent = '保存'; }
  renderGeologyEditBody();
  document.getElementById('geo-modal').classList.add('open');
  setTimeout(() => {
    const body = document.getElementById('geo-modal-body');
    if(body) body.scrollTop = 0;
  }, 50);
}
window.openGeologyEdit = openGeologyEdit;

function closeGeologyEdit(){
  document.getElementById('geo-modal').classList.remove('open');
  window.editingGeology = null;
}
window.closeGeologyEdit = closeGeologyEdit;

    `<button type="button" class="chip ${g.geology===meta.key?'active':''}" onclick="setGeologyKey('${escAttr(meta.key)}')" style="${g.geology===meta.key?`background:${meta.color};color:${window.isDarkColor(meta.color)?'#fff':'#000'};border-color:${meta.color}`:''}">
      <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${escAttr(meta.color)};margin-right:5px;border:1px solid rgba(0,0,0,.1)"></span>

      ＋

    <div class="field">

    </div>

    <div class="field">
      <label class="field-label">コメント</label>
      <textarea class="textarea" id="ge-note" placeholder="観察事項・特徴など">${escAttr(g.note||'')}</textarea>
    </div>

    <div class="field">
      <label class="field-label">写真 (最大${window.MAX_PHOTOS_PER_GEOLOGY}枚)</label>
      <div class="photo-grid">${photoCells}${addCell}</div>
      <div class="photo-counter">${photos.length} / ${window.MAX_PHOTOS_PER_GEOLOGY} 枚</div>
    </div>

window.renderGeologyEditBody = renderGeologyEditBody;

function saveGeologyEditFieldsToState(){
  const g = window.editingGeology;
  if(!g) return;
  const cust = document.getElementById('ge-geoCustom');
  if(cust) g.geologyCustom = cust.value.trim();
  const note = document.getElementById('ge-note');
  if(note) g.note = note.value;
}

function setGeologyKey(key){
  saveGeologyEditFieldsToState();
  window.editingGeology.geology = key;
  renderGeologyEditBody();
}
window.setGeologyKey = setGeologyKey;

async function addGeologyPhotos(files){
  saveGeologyEditFieldsToState();
  const g = window.editingGeology;
  const rod = window.editingRod;
  const w = window.currentWell;
  if(!g || !rod || !w) return;
  const existing = g.photos || [];
  const remain = window.MAX_PHOTOS_PER_GEOLOGY - existing.length;
  const list = Array.from(files).slice(0, remain);
  if(list.length === 0){
    showToast(`写真は最大${window.MAX_PHOTOS_PER_GEOLOGY}枚です`, 'var(--orange)');
    return;
  }
  // 一意なIDを準備（保存前なので仮）
  const tempEntryId = g._tempId || (g._tempId = window.genId('ge_'));
  showToast(`${list.length}枚をアップロード中…`, 'var(--blue)');
  let success = 0, failed = 0;
  for(const f of list){
    try{
      const blob = await window.compressImage(f);
      const fileName = `geo_${Date.now()}_${Math.random().toString(36).substr(2,5)}.jpg`;
      const path = `wells/${w.id}/rods/${rod.id}/${tempEntryId}/${fileName}`;
      const sref = window.FB.ref(window.FB.storage, path);
      await Promise.race([
        window.FB.uploadBytes(sref, blob, { contentType:'image/jpeg' }),
        new Promise((_,rej) => setTimeout(()=>rej(new Error('Storage uploadBytes timeout(60s)')), 60000))
      ]);
      const url = await Promise.race([
        window.FB.getDownloadURL(sref),
        new Promise((_,rej) => setTimeout(()=>rej(new Error('getDownloadURL timeout(30s)')), 30000))
      ]);
      existing.push({ url, path, addedAt: window.isoNow() });
      success++;
    } catch(e){
      failed++;
      if(failed === 1) showToast('写真アップロード失敗: ' + (e.message||e), 'var(--red)');
    }
  }
  g.photos = existing;
  renderGeologyEditBody();
  if(failed === 0) showToast(`${success}枚をアップロードしました`);
  else if(success > 0) showToast(`${success}枚成功 / ${failed}枚失敗`, 'var(--orange)');
}
window.addGeologyPhotos = addGeologyPhotos;

async function removeGeologyPhoto(index){
  saveGeologyEditFieldsToState();
  const g = window.editingGeology;
  if(!g || !g.photos) return;
  const photo = g.photos[index];
  if(!photo) return;
  showConfirm('この写真を削除しますか？', async () => {
    try{
      if(photo.path){
        const sref = window.FB.ref(window.FB.storage, photo.path);
        await window.FB.deleteObject(sref).catch(()=>{});
      }
      g.photos.splice(index, 1);
      renderGeologyEditBody();
      showToast('削除しました');
    } catch(e){
      showToast('削除失敗: ' + (e.message||e), 'var(--red)');
    }
  });
}
window.removeGeologyPhoto = removeGeologyPhoto;

// 地質エントリ削除（ロッドの geologies 配列から）
async function removeGeologyEntry(index){
  const rod = window.editingRod;
  const w = window.currentWell;
  if(!rod || !w) return;
  const g = (rod.geologies || [])[index];
  if(!g) return;
  showConfirm('この地質を削除しますか？\n（写真も全て削除されます）', async () => {
    try{
      // 写真をStorageから削除
      const photos = g.photos || [];
      await Promise.all(photos.map(p =>
        p.path ? window.FB.deleteObject(window.FB.ref(window.FB.storage, p.path)).catch(()=>{}) : Promise.resolve()
      ));
      rod.geologies.splice(index, 1);
      // 即時保存
      const ref = window.FB.doc(window.FB.db, 'wells', w.id, 'rods', rod.id);
      window.stampAudit(rod, false);
      const data = window.sanitize({ ...rod });
      delete data.id;
      await window.FB.setDoc(ref, data, { merge:false });
      // 反映
      const idx = window.currentRods.findIndex(x => x.id === rod.id);
      if(idx >= 0) window.currentRods[idx] = JSON.parse(JSON.stringify(rod));
      renderRodEditBody();
      showToast('地質を削除しました');
    } catch(e){
      showToast('削除失敗: ' + (e.message||e), 'var(--red)');
    }
  });
}
window.removeGeologyEntry = removeGeologyEntry;

// 地質エントリ保存（追加または編集）
async function saveGeology(){
  saveGeologyEditFieldsToState();
  const g = window.editingGeology;
  const rod = window.editingRod;
  const w = window.currentWell;
  if(!g || !rod || !w) return;

  if(!g.geology){ showToast('地質を選択してください', 'var(--red)'); return; }
  if(g.geology === 'other' && !(g.geologyCustom||'').trim()){
    showToast('カスタム地質名を入力してください', 'var(--red)'); return;
  }

  const btn = document.getElementById('geo-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  let saved = false;
  try{
    rod.geologies = rod.geologies || [];
    const idx = g._index;
    const entry = {
      geology: g.geology,
      geologyCustom: g.geologyCustom || null,
      note: g.note || '',
      photos: g.photos || [],
      addedAt: g.addedAt || window.isoNow()
    };
    if(idx === -1){
      rod.geologies.push(entry);
    } else {
      rod.geologies[idx] = entry;
    }
    window.stampAudit(rod, false);

    const ref = window.FB.doc(window.FB.db, 'wells', w.id, 'rods', rod.id);
    const data = window.sanitize({ ...rod });
    delete data.id;
    await Promise.race([
      window.FB.setDoc(ref, data, { merge:false }),
      new Promise((_,rej) => setTimeout(()=>rej(new Error('Firestore書き込みがタイムアウト(60秒)')), 60000))
    ]);

    // currentRodsに反映
    const cidx = window.currentRods.findIndex(x => x.id === rod.id);
    if(cidx >= 0) window.currentRods[cidx] = JSON.parse(JSON.stringify(rod));
    saved = true;
    closeGeologyEdit();
    renderRodEditBody();
    showToast(idx === -1 ? '地質を追加しました' : '地質を更新しました');
  } catch(e){
    showToast('保存失敗: ' + (e.message||e), 'var(--red)');
  } finally {
    if(!saved){
      btn.disabled = false; btn.textContent = '保存';
    }
  }
}
window.saveGeology = saveGeology;

async function deleteGeology(){
  const g = window.editingGeology;
  if(!g || g._index < 0) return;
  showConfirm('この地質を削除しますか？\n（写真も全て削除されます）', async () => {
    closeGeologyEdit();
    await removeGeologyEntry(g._index);
  });
}
window.deleteGeology = deleteGeology;

<script>
// ============================================================
// 共有リンク
// ============================================================
async function openShareModal(wellId){
  const w = window.currentWell;
  if(!w) return;
  const body = document.getElementById('share-modal-body');
  body.innerHTML = '<div class="loader-page"><span class="loader"></span>共有リンクを準備中…</div>';
  document.getElementById('share-modal').classList.add('open');

  try{
    // 既存トークンを探す（このwellIdの未失効トークン）
    let token = null, expireAt = null;
    if(w.shareToken){
      const exp = w.shareExpireAt ? new Date(w.shareExpireAt) : null;
      if(exp && exp > new Date()){
        token = w.shareToken;
        expireAt = exp;
      }
    }
    // 新規発行
    if(!token){
      token = window.genToken();
      expireAt = new Date(Date.now() + window.SHARE_EXPIRE_DAYS * 24 * 60 * 60 * 1000);
      const sref = window.FB.doc(window.FB.db, 'wellShares', token);
      await window.FB.setDoc(sref, window.sanitize({
        wellId: w.id,
        siteName: w.siteName,
        expireAt: expireAt.toISOString(),
        createdAt: window.isoNow(),
        createdBy: window.currentUser ? window.currentUser.email : 'unknown',
        // v1.2.1: 共有モードで地質名を正しく表示するため、現時点のカスタム地質を含める
        // v1.2.2: パターン情報も含める
        customGeologies: window.userPrefs.customGeologies || [],
        geologyOrder: window.userPrefs.geologyOrder || [],
        geologyPatterns: window.userPrefs.geologyPatterns || {}
      }));
      // 現場側にも記録
      const wref = window.FB.doc(window.FB.db, 'wells', w.id);
      await window.FB.updateDoc(wref, {
        shareToken: token,
        shareExpireAt: expireAt.toISOString()
      });
      w.shareToken = token; w.shareExpireAt = expireAt.toISOString();
    } else {
      // 既存トークンでもカスタム地質・パターンスナップショットを最新化
      try{
        const sref = window.FB.doc(window.FB.db, 'wellShares', token);
        await window.FB.updateDoc(sref, window.sanitize({
          customGeologies: window.userPrefs.customGeologies || [],
          geologyOrder: window.userPrefs.geologyOrder || [],
          geologyPatterns: window.userPrefs.geologyPatterns || {},
          updatedAt: window.isoNow()
        }));
      } catch(e){
        // 更新失敗は致命的でないので無視
      }
    }

    const baseUrl = window.location.origin + window.location.pathname;
    const shareUrl = `${baseUrl}?share=${token}`;
    const subject = `井戸採掘記録：${w.siteName||''}`;
    const message = `井戸採掘の記録をご覧いただけます。\n${shareUrl}\n\n（このリンクは ${formatDateOnly(expireAt)} まで有効です）`;

    body.innerHTML = `
      <div class="field">
        <label class="field-label">共有リンク（閲覧専用）</label>
        <div class="share-url-box">${escAttr(shareUrl)}</div>
        <div class="field-hint">期限: ${escAttr(formatDateOnly(expireAt))}まで</div>
      </div>
      <div style="display:flex;justify-content:center;margin:10px 0">
        <div id="share-qr-canvas" style="padding:6px;background:#fff;border:1px solid var(--border);border-radius:6px"></div>
      </div>
      <div class="field-hint" style="text-align:center;margin-top:-4px">スマホでスキャンして開けます</div>
      <div class="share-buttons" style="margin-top:14px">
        <button class="share-btn" type="button" onclick="copyShareUrl('${escAttr(shareUrl)}')">📋 リンクをコピー</button>
        <button class="share-btn" type="button" onclick="shareViaMail('${escAttr(subject)}','${escAttr(message)}')">📧 メールで送る</button>
        <button class="share-btn line" type="button" onclick="shareViaLine('${escAttr(message)}')">LINEで送る</button>
        <button class="share-btn" type="button" onclick="revokeShare('${escAttr(w.id)}')" style="color:var(--red);border-color:var(--red)">🚫 リンクを無効化</button>
      </div>
      <div class="field-hint" style="margin-top:14px">
        共有リンクで開いた人は、ログイン不要で記録を閲覧できます（編集はできません）。<br>
        記録を追加すると、共有先でも自動的に最新の内容が見られます。
      </div>
    `;
    // QRコード描画
    setTimeout(() => {
      if(typeof QRCode !== 'undefined'){
        const qrEl = document.getElementById('share-qr-canvas');
        if(qrEl){
          try{ new QRCode(qrEl, { text: shareUrl, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M }); }
          catch(e){ qrEl.textContent = 'QR生成失敗'; }
        }
      }
    }, 100);
  } catch(e){
    body.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">共有リンク発行に失敗: ${escAttr(e.message||'')}</div></div>`;
  }
}
window.openShareModal = openShareModal;

function closeShareModal(){
  document.getElementById('share-modal').classList.remove('open');
}
window.closeShareModal = closeShareModal;

async function copyShareUrl(url){
  try{
    await navigator.clipboard.writeText(url);
    showToast('リンクをコピーしました');
  } catch(e){
    // フォールバック
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); showToast('リンクをコピーしました'); }
    catch(_){ showToast('コピー失敗', 'var(--red)'); }
    document.body.removeChild(ta);
  }
}
window.copyShareUrl = copyShareUrl;

function shareViaMail(subject, body){
  const u = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = u;
}
window.shareViaMail = shareViaMail;

function shareViaLine(text){
  const u = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
  window.open(u, '_blank', 'noopener');
}
window.shareViaLine = shareViaLine;

async function revokeShare(wellId){
  showConfirm('共有リンクを無効化しますか？\n（このリンクで開いている人は閲覧できなくなります）', async () => {
    try{
      const w = window.currentWell;
      if(w && w.shareToken){
        const sref = window.FB.doc(window.FB.db, 'wellShares', w.shareToken);
        await window.FB.deleteDoc(sref).catch(()=>{});
      }
      const wref = window.FB.doc(window.FB.db, 'wells', wellId);
      await window.FB.updateDoc(wref, { shareToken: null, shareExpireAt: null });
      if(w){ w.shareToken = null; w.shareExpireAt = null; }
      closeShareModal();
      showToast('共有リンクを無効化しました');
    } catch(e){
      showToast('失敗: ' + e.message, 'var(--red)');
    }
  });
}
window.revokeShare = revokeShare;
</script>

<script>
// ============================================================
// 設定ページ
// ============================================================
function switchSettingsTab(tab){
  window.currentSettingsTab = tab;
  document.querySelectorAll('.settings-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.stab === tab);
  });
  renderSettings();
}
window.switchSettingsTab = switchSettingsTab;

function renderSettings(){
  const tab = window.currentSettingsTab || 'staff';
  const body = document.getElementById('settings-body');
  if(tab === 'staff'){
    const items = window.userPrefs.staff.map((s,i) => `
      <div class="master-item">

    body.innerHTML = `
      <div class="card">
        <div class="section-title" style="margin-top:0">担当者一覧</div>

        <div class="master-add-row">
          <input id="staff-add-input" class="input" type="text" placeholder="担当者名を入力">
          <button class="btn btn-primary" onclick="addStaff()" type="button">追加</button>
        </div>
        <div class="field-hint" style="margin-top:8px">現場の担当者リストです。追加すると現場編集時の選択肢に反映されます。</div>
      </div>
    `;
  } else if(tab === 'geology'){
    const order = getMergedGeologyOrder();
    const items = order.map((entry, i) => {
      const meta = window.getGeologyByKey(entry.key);
      const isCustom = entry.custom;
      const label = isCustom && entry.label ? entry.label : meta.label;
      const color = isCustom && entry.color ? entry.color : meta.color;
      const pattern = (isCustom ? entry.pattern : meta.pattern) || 'none';
      const patternLabel = (window.GEO_PATTERNS.find(p => p.key === pattern) || {label:'無地'}).label;
      return `
        <div class="master-item">
          <span class="geology-legend-swatch geo-pattern-${escAttr(pattern)}" style="background-color:${escAttr(color)};width:24px;height:24px"></span>
          <span class="master-item-name">${escAttr(label)}${isCustom?'':' <span style="color:var(--text3);font-size:11px">（標準）</span>'}</span>
          <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
            <button class="btn btn-sm btn-ghost pattern-pick-btn" onclick="openPatternPicker('${escAttr(entry.key)}', '${escAttr(color)}')" type="button" title="パターン変更">
              <span class="pattern-pick-preview geo-pattern-${escAttr(pattern)}" style="background-color:${escAttr(color)}"></span>
              <span class="pattern-pick-label">${escAttr(patternLabel)}</span>
            </button>
            <button class="btn btn-sm btn-ghost" onclick="moveGeology(${i},-1)" type="button" ${i===0?'disabled':''} title="上へ">↑</button>
            <button class="btn btn-sm btn-ghost" onclick="moveGeology(${i},1)" type="button" ${i===order.length-1?'disabled':''} title="下へ">↓</button>
            ${isCustom ? `<button class="btn btn-sm btn-ghost" onclick="removeGeology('${escAttr(entry.key)}')" type="button" style="color:var(--red)">削除</button>` : ''}
          </div>
        </div>`;
    }).join('');
    body.innerHTML = `
      <div class="card">
        <div class="section-title" style="margin-top:0">地質マスタ（並び替え＆パターン）</div>
        <div class="master-list">${items}</div>
        <div class="field-hint" style="margin-top:8px">
          ↑↓で順序変更、パターンボタンをタップして背景パターンを選べます。<br>
          <strong>無地</strong>=色のみ、<strong>細粒</strong>=砂、<strong>粗粒</strong>=砂利、<strong>斜線</strong>=粘土、<strong>横線</strong>=火山灰、<strong>クロス</strong>=表土向け。
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">カスタム地質を追加</div>
        <div class="master-add-row" style="flex-wrap:wrap">
          <input id="geo-add-label" class="input" type="text" placeholder="地質名（例: 軟泥）" style="flex:2;min-width:140px">
          <input id="geo-add-color" class="input" type="color" value="#9F8B6B" style="flex:0 0 60px;padding:2px" oninput="refreshAddPatternPreview()">
          <button class="btn pattern-pick-btn" type="button" onclick="openAddPatternPicker()" id="geo-add-pattern-btn">
            <span class="pattern-pick-preview geo-pattern-none" id="geo-add-pattern-preview" style="background-color:#9F8B6B"></span>
            <span class="pattern-pick-label" id="geo-add-pattern-label">無地</span>
          </button>
          <input type="hidden" id="geo-add-pattern" value="none">
          <button class="btn btn-primary" onclick="addGeology()" type="button">追加</button>
        </div>
      </div>
    `;
  } else if(tab === 'theme'){
    const themes = [
      { key:'navy',    name:'ネイビー',  swatch:'#0D2C5E', text:'#FFF' },
      { key:'natural', name:'ナチュラル', swatch:'#2D5A3D', text:'#FFF' },
      { key:'mint',    name:'ミント',    swatch:'#0E7C5C', text:'#FFF' },
      { key:'sunset',  name:'サンセット', swatch:'#C0392B', text:'#FFF' },
      { key:'dark',    name:'ダーク',    swatch:'#1C1E26', text:'#5B8FCF' }
    ];
    const cards = themes.map(t => `
      <div class="theme-card ${window.userPrefs.theme===t.key?'active':''}" onclick="selectTheme('${t.key}')">
        <div class="theme-card-swatch" style="background:${t.swatch};color:${t.text}">Aa</div>
        <div class="theme-card-name">${escAttr(t.name)}</div>
      </div>
    `).join('');
    body.innerHTML = `
      <div class="card">
        <div class="section-title" style="margin-top:0">テーマカラー</div>
        <div class="theme-grid">${cards}</div>
        <div class="field-hint" style="margin-top:10px">この端末で表示するテーマです。他の端末でも自動的に反映されます。</div>
      </div>
    `;
  } else if(tab === 'info'){
    body.innerHTML = `
      <div class="card">
        <div class="section-title" style="margin-top:0">システム情報</div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px">
          <div style="color:var(--text2)">バージョン</div><div>${escAttr(window.APP_VERSION)}</div>
          <div style="color:var(--text2)">ビルド</div><div>${escAttr(window.APP_BUILD_TIME)}</div>
          <div style="color:var(--text2)">Firebase</div><div>flexsysv2026 (asia-northeast1)</div>
          <div style="color:var(--text2)">標準ヘッド長</div><div>${window.DEFAULT_HEAD_ROD_M}m</div>
          <div style="color:var(--text2)">標準ロッド長</div><div>${window.DEFAULT_PIPE_M}m</div>
          <div style="color:var(--text2)">共有リンク期限</div><div>${window.SHARE_EXPIRE_DAYS}日</div>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">使い方の概要</div>
        <ol style="padding-left:20px;font-size:13px;line-height:1.8;color:var(--text2)">
          <li><strong style="color:var(--text)">現場を新規作成</strong>：現場名・住所・担当者・ヘッド長(${window.DEFAULT_HEAD_ROD_M}m)・ロッド長(${window.DEFAULT_PIPE_M}m)を設定</li>
          <li><strong style="color:var(--text)">採掘開始</strong>：地層が変わるたびに「＋ ログ追加」</li>
          <li><strong style="color:var(--text)">パイプ本数を入力</strong>：完了本数 ＋ 進入率（25%刻み）→ 深度を自動計算</li>
          <li><strong style="color:var(--text)">地質をタップ</strong>：土・砂・砂利・粘土・木片・軟岩・岩盤・その他</li>
          <li><strong style="color:var(--text)">写真を撮影</strong>：1ログにつき最大5枚（スマホは内蔵カメラ起動）</li>
          <li><strong style="color:var(--text)">共有</strong>：現場詳細から共有リンクを発行→メール／LINEで送信</li>
        </ol>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">深度計算式</div>
        <div style="background:var(--surface2);padding:12px;border-radius:8px;font-family:monospace;font-size:12px;line-height:1.8">
          ${escAttr('N = 0 のとき: 深度 = P × H')}<br>
          ${escAttr('N ≥ 1 のとき: 深度 = H + (N−1) × L + P × L')}<br>
          <br>
          H = ヘッド長, L = ロッド長, N = 完了本数, P = 進入率
        </div>
        <div class="field-hint" style="margin-top:8px">計算サンプル → H=1.2m, L=1.5m, 5本完了+6本目50% → 1.2 + 4×1.5 + 0.5×1.5 = 7.95m</div>
      </div>
    `;
  }
}
window.renderSettings = renderSettings;

async function addStaff(){
  const inp = document.getElementById('staff-add-input');
  const v = (inp?.value || '').trim();
  if(!v){ showToast('担当者名を入力してください', 'var(--orange)'); return; }
  if(window.userPrefs.staff.includes(v)){ showToast('既に登録されています', 'var(--orange)'); return; }
  window.userPrefs.staff.push(v);
  inp.value = '';
  await window.saveUserPrefs();
  renderSettings();
  showToast('追加しました');
}
window.addStaff = addStaff;

async function removeStaff(index){
  showConfirm('この担当者を削除しますか？', async () => {
    window.userPrefs.staff.splice(index, 1);
    await window.saveUserPrefs();
    renderSettings();
    showToast('削除しました');
  });
}
window.removeStaff = removeStaff;

// 標準地質＋カスタム地質を、並び順を考慮してマージしたリストを返す
// userPrefs.geologyOrder には ['soil', 'sand', 'custom_xxx', ...] のkey順序を保存
function getMergedGeologyOrder(){
  const all = window.getAllGeologies();
  const order = (window.userPrefs.geologyOrder || []).slice();
  // 順序リストにあるキーを優先、なければall順序の末尾に追加
  const result = [];
  const seen = new Set();
  order.forEach(key => {
    const meta = all.find(x => x.key === key);
    if(meta){
      const isCustom = key.startsWith('custom_');
      result.push({ key, label: meta.label, color: meta.color, custom: isCustom });
      seen.add(key);
    }
  });
  all.forEach(meta => {
    if(!seen.has(meta.key)){
      const isCustom = meta.key.startsWith('custom_');
      result.push({ key: meta.key, label: meta.label, color: meta.color, custom: isCustom });
    }
  });
  return result;
}
window.getMergedGeologyOrder = getMergedGeologyOrder;

async function addGeology(){
  const labelEl = document.getElementById('geo-add-label');
  const colorEl = document.getElementById('geo-add-color');
  const patternEl = document.getElementById('geo-add-pattern');
  const label = (labelEl?.value || '').trim();
  const color = colorEl?.value || '#9F8B6B';
  const pattern = patternEl?.value || 'none';
  if(!label){ showToast('地質名を入力してください', 'var(--orange)'); return; }
  const key = 'custom_' + Date.now().toString(36);
  window.userPrefs.customGeologies = window.userPrefs.customGeologies || [];
  window.userPrefs.customGeologies.push({ key, label, color, pattern });
  // 並び順リストにも追加（末尾）
  window.userPrefs.geologyOrder = window.userPrefs.geologyOrder || [];
  window.userPrefs.geologyOrder.push(key);
  labelEl.value = '';
  await window.saveUserPrefs();
  renderSettings();
  showToast('追加しました');
}
window.addGeology = addGeology;

// 地質のパターン変更（標準・カスタム両方対応、標準は上書きとしてgeologyPatternsに保存）
async function setGeologyPattern(key, pattern){
  if(!pattern) pattern = 'none';
  // カスタム地質ならcustomGeologiesを更新
  const cust = (window.userPrefs.customGeologies || []).find(g => g.key === key);
  if(cust){
    cust.pattern = pattern;
  } else {
    // 標準地質はgeologyPatterns（マッピング）に保存
    window.userPrefs.geologyPatterns = window.userPrefs.geologyPatterns || {};
    window.userPrefs.geologyPatterns[key] = pattern;
  }
  await window.saveUserPrefs();
  renderSettings();
  showToast('パターンを変更しました');
  // 開いている現場詳細があれば再描画
  if(window.currentWell && typeof window.renderDetail === 'function'){
    window.renderDetail();
  }
}
window.setGeologyPattern = setGeologyPattern;

// v1.2.5: パターンピッカー（プレビュー付き）
let _patternPickerCtx = null; // {key:..., color:..., mode:'edit'|'add'}

function openPatternPicker(geoKey, color){
  _patternPickerCtx = { key:geoKey, color:color, mode:'edit' };
  renderPatternPicker();
  document.getElementById('pattern-picker-modal').classList.add('open');
}
window.openPatternPicker = openPatternPicker;

function openAddPatternPicker(){
  const colorEl = document.getElementById('geo-add-color');
  const curEl = document.getElementById('geo-add-pattern');
  _patternPickerCtx = { key:null, color:(colorEl?.value || '#9F8B6B'), mode:'add', current:(curEl?.value || 'none') };
  renderPatternPicker();
  document.getElementById('pattern-picker-modal').classList.add('open');
}
window.openAddPatternPicker = openAddPatternPicker;

function closePatternPicker(){
  document.getElementById('pattern-picker-modal').classList.remove('open');
  _patternPickerCtx = null;
}
window.closePatternPicker = closePatternPicker;

function renderPatternPicker(){
  if(!_patternPickerCtx) return;
  const body = document.getElementById('pattern-picker-body');
  const ctx = _patternPickerCtx;
  let currentPattern = 'none';
  if(ctx.mode === 'edit'){
    const meta = window.getGeologyByKey(ctx.key);
    currentPattern = meta.pattern || 'none';
  } else {
    currentPattern = ctx.current || 'none';
  }
  const items = window.GEO_PATTERNS.map(p => {
    const active = p.key === currentPattern ? 'active' : '';
    return `
      <div class="pattern-grid-item ${active}" onclick="selectPatternFromPicker('${escAttr(p.key)}')">
        <div class="pattern-grid-preview geo-pattern-${escAttr(p.key)}" style="background-color:${escAttr(ctx.color)}"></div>
        <div class="pattern-grid-label">${escAttr(p.label)}</div>
      </div>`;
  }).join('');
  body.innerHTML = `
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">
      タップして選択。プレビューは現在の色で表示しています。
    </div>
    <div class="pattern-grid">${items}</div>
  `;
}

async function selectPatternFromPicker(patternKey){
  const ctx = _patternPickerCtx;
  if(!ctx) return;
  if(ctx.mode === 'edit'){
    closePatternPicker();
    await setGeologyPattern(ctx.key, patternKey);
  } else {
    // 追加モード：hidden inputとプレビューを更新
    const hid = document.getElementById('geo-add-pattern');
    const prev = document.getElementById('geo-add-pattern-preview');
    const lab = document.getElementById('geo-add-pattern-label');
    if(hid) hid.value = patternKey;
    if(prev){
      // 既存クラスを取り除き新しいパターンクラスを付与
      prev.className = 'pattern-pick-preview geo-pattern-' + patternKey;
    }
    if(lab){
      const found = window.GEO_PATTERNS.find(p => p.key === patternKey);
      lab.textContent = found ? found.label : '無地';
    }
    closePatternPicker();
  }
}
window.selectPatternFromPicker = selectPatternFromPicker;

// 追加フォームの色変更時にプレビューの背景色を更新
function refreshAddPatternPreview(){
  const colorEl = document.getElementById('geo-add-color');
  const prev = document.getElementById('geo-add-pattern-preview');
  if(colorEl && prev){
    prev.style.backgroundColor = colorEl.value;
  }
}
window.refreshAddPatternPreview = refreshAddPatternPreview;

async function removeGeology(key){
  showConfirm('このカスタム地質を削除しますか？\n（既に記録に使われている場合は表示が「その他」相当になります）', async () => {
    window.userPrefs.customGeologies = (window.userPrefs.customGeologies || []).filter(g => g.key !== key);
    window.userPrefs.geologyOrder = (window.userPrefs.geologyOrder || []).filter(k => k !== key);
    await window.saveUserPrefs();
    renderSettings();
    showToast('削除しました');
  });
}
window.removeGeology = removeGeology;

async function moveGeology(index, direction){
  const order = getMergedGeologyOrder().map(o => o.key);
  const newIndex = index + direction;
  if(newIndex < 0 || newIndex >= order.length) return;
  const tmp = order[index];
  order[index] = order[newIndex];
  order[newIndex] = tmp;
  window.userPrefs.geologyOrder = order;
  await window.saveUserPrefs();
  renderSettings();
}
window.moveGeology = moveGeology;

async function selectTheme(theme){
  window.applyTheme(theme);
  await window.saveUserPrefs();
  renderSettings();
  showToast('テーマを変更しました');
}
window.selectTheme = selectTheme;

async function saveDefaults(){
  const headEl = document.getElementById('def-headRod');
  const pipeEl = document.getElementById('def-pipe');
  const head = Number(headEl?.value);
  const pipe = Number(pipeEl?.value);
  if(!(head > 0 && head < 10)){ showToast('ドリルヘッド長が不正です（0.1〜10）', 'var(--red)'); return; }
  if(!(pipe > 0 && pipe < 10)){ showToast('追加ロッド長が不正です（0.1〜10）', 'var(--red)'); return; }
  window.userPrefs.defaultHeadRodLengthM = head;
  window.userPrefs.defaultPipeLengthM = pipe;
  await window.saveUserPrefs();
  showToast('既定値を保存しました');
}
window.saveDefaults = saveDefaults;

// ============================================================
// 印刷ビュー / PDF出力（v1.2.0）
// ============================================================
const PRINT_RODS_PER_PAGE = 8; // 1ページあたりのロッド数

function openPrintView(){
  const w = window.currentWell;
  if(!w){ showToast('現場が選択されていません', 'var(--red)'); return; }
  const rods = (window.currentRods || []).slice().sort((a,b)=>(a.rodNum||0)-(b.rodNum||0));
  // ページ分割
  const pages = [];
  if(rods.length === 0){
    pages.push({ rods: [] });
  } else {
    for(let i = 0; i < rods.length; i += PRINT_RODS_PER_PAGE){
      pages.push({ rods: rods.slice(i, i + PRINT_RODS_PER_PAGE) });
    }
  }
  const totalPages = pages.length;

  // 共有URL（既存トークンがあればそれ、なければ後で発行）
  let shareUrl = '';
  if(w.shareToken && w.shareExpireAt && new Date(w.shareExpireAt) > new Date()){
    const baseUrl = window.location.origin + window.location.pathname;
    shareUrl = `${baseUrl}?share=${w.shareToken}`;
  }
  const pdfHintUrl = window.location.origin + window.location.pathname; // 同一URL（動的生成型）

  // v1.3.2: 地質情報セクション（印刷の1ページ目に表示）
  let geoInfoSection = '';
  if(w.geoInfo){
    const sg = w.geoInfo.surfaceGeology || {};
    const el = w.geoInfo.elevation || {};
    const items = [];
    if(sg.fetchStatus === 'ok'){
      if(sg.lithology_ja) items.push(`<div class="print-geoinfo-row"><span class="print-geoinfo-label">岩相</span><strong>${escAttr(sg.lithology_ja)}</strong></div>`);
      if(sg.formationAge_ja) items.push(`<div class="print-geoinfo-row"><span class="print-geoinfo-label">形成時代</span>${escAttr(sg.formationAge_ja)}</div>`);
      if(sg.group_ja) items.push(`<div class="print-geoinfo-row"><span class="print-geoinfo-label">分類</span>${escAttr(sg.group_ja)}</div>`);
    }
    if(el.fetchStatus === 'ok'){
      items.push(`<div class="print-geoinfo-row"><span class="print-geoinfo-label">標高</span><strong>${el.meters} m</strong>${el.hsrc?` <span style="font-size:9px;color:#888">(${escAttr(el.hsrc)})</span>`:''}</div>`);
    }
    if(items.length > 0){
      geoInfoSection = `
        <div class="print-geoinfo-box">
          <div class="print-geoinfo-title">📍 公的地質情報（事前調査）</div>
          <div class="print-geoinfo-grid">${items.join('')}</div>
          <div class="print-geoinfo-source">出典: 産総研20万分の1日本シームレス地質図V2 / 国土地理院基盤地図情報数値標高モデル</div>
        </div>`;
    }
  }

  // v1.3.2: 現場全体メモ（noteフィールド）
  const wellNoteSection = (w.note && w.note.trim()) ? `
    <div class="print-note-box">
      <div class="print-note-title">📝 現場メモ</div>
      <div class="print-note-body">${escAttr(w.note).replace(/\n/g, '<br>')}</div>
    </div>` : '';

  const headerInfo = `
    <div class="print-meta-grid">
      <div>顧客</div><div>${escAttr(w.customerName||'—')}</div>
      <div>住所</div><div>${escAttr(w.address||'—')}</div>
      <div>担当</div><div>${escAttr(w.staff||'—')}</div>
      <div>状態</div><div>${escAttr({draft:'下書き',drilling:'作業中',completed:'完了',archived:'アーカイブ'}[w.status||'drilling'])}</div>
      <div>ヘッド長</div><div>${Number(w.headRodLengthM||1.2).toFixed(2)} m</div>
      <div>ロッド長</div><div>${Number(w.pipeLengthM||1.5).toFixed(2)} m</div>
      ${w.targetDepthM ? `<div>目標深度</div><div>${Number(w.targetDepthM).toFixed(2)} m</div>` : '<div>目標深度</div><div>—</div>'}
      <div>現在深度</div><div>${rods.length>0 ? window.rodDepth(w.headRodLengthM, w.pipeLengthM, rods[rods.length-1].rodNum).toFixed(2)+' m' : '0.00 m'}</div>
    </div>
    ${geoInfoSection}
    ${wellNoteSection}
  `;

  const pagesHtml = pages.map((p, pi) => {
    const isLast = pi === totalPages - 1;
    // 柱状図（このページに含まれるロッドのみ）
    let barRods = '';
    if(p.rods.length > 0){
      barRods = p.rods.map(r => {
        const range = window.rodRange(w.headRodLengthM, w.pipeLengthM, r.rodNum);
        const segLen = range[1] - range[0];
        const geos = r.geologies || [];
        let geoBar;
        if(geos.length === 0){
          geoBar = `<div class="print-bar-geo" style="background:repeating-linear-gradient(45deg,#eee,#eee 4px,#fff 4px,#fff 8px);color:#999">未登録</div>`;
        } else {
          geoBar = geos.map(g => {
            const meta = window.getGeologyByKey(g.geology || 'soil');
            const dark = window.isDarkColor(meta.color);
            const label = g.geology === 'other' && g.geologyCustom ? g.geologyCustom : meta.label;
            const _ppat = meta.pattern || 'none';
            return `<div class="print-bar-geo geo-pattern-${escAttr(_ppat)}" style="background-color:${escAttr(meta.color)};color:${dark?'#fff':'#000'}"><span class="print-bar-geo-label">${escAttr(label)}</span></div>`;
          }).join('');
        }
        return `
          <div class="print-bar-rod" style="flex: ${segLen};">
            <div class="print-bar-rod-num">${r.rodNum}本</div>
            <div class="print-bar-rod-depth">${range[1].toFixed(2)}m</div>
            ${geoBar}
          </div>`;
      }).join('');
    } else {
      barRods = `<div class="print-bar-geo" style="flex:1;color:#999">ロッド未追加</div>`;
    }

    // 詳細
    let detailRods = '';
    if(p.rods.length > 0){
      detailRods = p.rods.map(r => {
        const range = window.rodRange(w.headRodLengthM, w.pipeLengthM, r.rodNum);
        const geos = r.geologies || [];
        const geoRows = geos.length === 0 ?
          `<div class="print-empty" style="padding:6px;font-size:9px">地質未登録</div>` :
          geos.map(g => {
            const meta = window.getGeologyByKey(g.geology || 'soil');
            const label = g.geology === 'other' && g.geologyCustom ? g.geologyCustom : meta.label;
            const photos = (g.photos||[]).slice(0,3).map(p =>
              `<img src="${escAttr(p.url)}" class="print-geo-photo" alt="" crossorigin="anonymous">`
            ).join('');
            return `
              <div class="print-geo-row">
                <div class="print-geo-swatch" style="background:${escAttr(meta.color)}"></div>
                <div class="print-geo-info">
                  <div class="print-geo-label">${escAttr(label)}</div>
                  ${g.note ? `<div class="print-geo-note">${escAttr(g.note)}</div>` : ''}
                  ${photos ? `<div class="print-geo-photos">${photos}</div>` : ''}
                </div>
              </div>`;
          }).join('');
        return `
          <div class="print-rod-detail">
            <div class="print-rod-detail-head">
              <span class="print-rod-detail-num">ロッド ${r.rodNum}本目</span>
              <span class="print-rod-detail-range">${range[0].toFixed(2)}〜${range[1].toFixed(2)}m</span>
              <span class="print-rod-detail-depth">${range[1].toFixed(2)}m</span>
            </div>
            ${geoRows}
          </div>`;
      }).join('');
    } else {
      detailRods = `<div class="print-empty">ロッドが未追加です</div>`;
    }

    // フッター（v1.3.2: QRコードは削除）
    let footer = '';
    if(isLast){
      footer = `
        <div class="print-footer">
          <div>
            野島技研 — 野島井戸システム ${escAttr(window.APP_VERSION)}<br>
            出力日時: ${escAttr(formatDateTime(window.isoNow()))}
          </div>
          <div style="font-size:10px;color:#666">
            ${shareUrl ? `共有URL: ${escAttr(shareUrl)}<br>` : ''}
            <a href="https://nojima-giken.com/well/" target="_blank" rel="noopener">https://nojima-giken.com/well/</a>
          </div>
        </div>`;
    } else {
      footer = `
        <div class="print-footer">
          <div>野島技研 — 続きは次のページへ</div>
          <div>${escAttr(formatDateTime(window.isoNow()))}</div>
        </div>`;
    }

    return `
      <div class="print-page">
        <div class="print-header">
          <div>
            <div class="print-title">${escAttr(w.siteName||'(現場名なし)')}</div>
            <div class="print-subtitle">井戸採掘地質記録 ${pi===0?'':'(続き)'}</div>
          </div>
          <div class="print-pageno">Page ${pi+1} / ${totalPages}</div>
        </div>
        ${pi===0 ? headerInfo : ''}
        <div class="print-body">
          <div class="print-bar">${barRods}</div>
          <div class="print-detail">${detailRods}</div>
        </div>
        ${footer}
      </div>`;
  }).join('');

  // 表示
  document.getElementById('print-view').innerHTML = pagesHtml;
  document.body.classList.add('print-mode');
  document.getElementById('print-actions').style.display = 'flex';
  window.scrollTo(0, 0);
  // v1.3.2: QRコード描画は削除（不要のため）
}
window.openPrintView = openPrintView;

function closePrintView(){
  document.body.classList.remove('print-mode');
  document.getElementById('print-actions').style.display = 'none';
  document.getElementById('print-view').innerHTML = '';
}
window.closePrintView = closePrintView;

function doPrint(){
  // ブラウザの印刷ダイアログを起動（送信先で「PDFとして保存」を選べる）
  window.print();
}
window.doPrint = doPrint;
</script>

</body>
</html>
